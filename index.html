/* ===== js/15-documentos.js ===== */
/* =====================================================================
   DOCUMENTOS · recetas, certificados y órdenes de estudio
   Con membrete (logo + línea dorada), datos ya cargados y listos para imprimir.
   ===================================================================== */
const TIPOS_DOC = { receta:'Receta', certificado:'Certificado', orden:'Orden de estudios' };
const docFiltro = { tipo:'', periodo:'mes', q:'', max:50 };

/* ---------- Partes del impreso ---------- */
function membrete(){
  const d = cfg().doctora;
  return `<div class="memb"><img class="memb-logo" src="${LOGO_COMPLETO}" alt="${esc(d.centro)}"><div><div class="memb-n">${esc(d.trato + ' ' + d.nombre)}</div><div class="memb-s">${esc(d.especialidad)}</div></div>
    <div class="memb-r">${esc(d.registro)}<br>${esc(d.direccion)}<br>Tel. ${esc(d.tel)} · ${esc(d.email)}</div></div><div class="memb-linea"></div>`;
}
function datosPacienteDoc(p, fecha){
  return `<div class="doc-pac"><div><b>Paciente:</b> ${esc(p.nombre)}</div><div><b>CI:</b> ${esc(p.ci || '—')}</div>
    <div><b>Edad:</b> ${p.nac ? edad(p.nac) + ' años' : '—'}</div><div><b>Cobertura:</b> ${esc(textoCobertura(p))}</div>
    ${fecha ? `<div><b>Fecha:</b> ${fLargaAnio(fecha)}</div>` : ''}</div>`;
}
function firmaDoc(){ const d = cfg().doctora; return `<div class="firma"><div><b>${esc(d.trato + ' ' + d.nombre)}</b>${esc(d.especialidad)} · ${esc(d.registro)}</div></div>`; }
function pieDoc(){ const d = cfg().doctora; return `<div class="doc-pie"><span>${esc(d.direccion)}</span><span>Tel. ${esc(d.tel)} · ${esc(d.email)}</span></div>`; }

function htmlDocumento(d){
  const p = paciente(d.pac), c = d.contenido || {};
  let cuerpo = '';
  if (d.tipo === 'receta'){
    cuerpo = `<div class="rp">Rp/</div>${(c.items || []).map(i => `<div class="rp-item"><b>${esc(i.med)}</b>${i.cant ? ` <span style="color:#50656E">· ${esc(i.cant)}</span>` : ''}<div>${esc(i.ind)}</div></div>`).join('')}
      ${c.diag ? `<p style="margin-top:14px"><b>Diagnóstico:</b> ${esc(c.diag)}</p>` : ''}${c.nota ? `<p><b>Indicaciones:</b> ${esc(c.nota)}</p>` : ''}`;
  } else if (d.tipo === 'certificado'){
    cuerpo = `<p style="font-size:14.5px;line-height:1.8;margin-top:10px">${esc(c.texto).replace(/\n/g, '<br>')}</p><p style="margin-top:14px">Se extiende el presente a solicitud del interesado/a, en ${esc((cfg().doctora.direccion.split(',').pop() || '').trim() || 'Montevideo')}, el ${fLargaAnio(d.fecha)}.</p>`;
  } else {
    cuerpo = `<p><b>Solicito:</b></p><div style="columns:2;column-gap:24px;margin:8px 0 12px">${(c.estudios || []).map(e => `<div style="padding:3px 0">☐ ${esc(e)}</div>`).join('')}</div>
      ${c.diag ? `<p><b>Diagnóstico presuntivo:</b> ${esc(c.diag)}</p>` : ''}${c.nota ? `<p><b>Observaciones:</b> ${esc(c.nota)}</p>` : ''}`;
  }
  const titulo = d.tipo === 'certificado' ? (CERTIFICADOS[c.sub] || 'Certificado médico') : TIPOS_DOC[d.tipo];
  return membrete() + `<div class="doc-t">${esc(titulo)}</div>${datosPacienteDoc(p, d.fecha)}<div class="doc-cuerpo">${cuerpo}</div>` + firmaDoc() + pieDoc();
}
function verDocumento(id){
  const d = documento(id);
  abrirModal({ titulo:TIPOS_DOC[d.tipo], sub:esc(nombrePac(d.pac)) + ' · ' + fCorta(d.fecha), ancho:'medio',
    cuerpo:`<div class="doc doc-prev">${htmlDocumento(d)}</div>`,
    pie:`${d.tipo === 'receta' ? `<button class="btn btn-linea izq" onclick="formReceta({pac:'${d.pac}', items:documento('${id}').contenido.items, diag:documento('${id}').contenido.diag})">${ico('repetir')} Emitir de nuevo</button>` : ''}
      <button class="btn btn-linea" onclick="cerrarModal()">Cerrar</button><button class="btn btn-prim" onclick="imprimir(htmlDocumento(documento('${id}')))">${ico('imprimir')} Imprimir</button>` });
}
function resumenDoc(d){
  const c = d.contenido || {};
  if (d.tipo === 'receta') return (c.items || []).map(i => i.med).join(' · ');
  if (d.tipo === 'certificado') return (CERTIFICADOS[c.sub] || 'Certificado') + (c.dias ? ' · ' + c.dias + ' días' : '');
  return (c.estudios || []).join(' · ');
}
function tablaDocumentos(docs, conPaciente){
  return `<table class="tabla resp"><thead><tr><th>Fecha</th><th>Tipo</th>${conPaciente ? '<th>Paciente</th>' : ''}<th>Contenido</th><th></th></tr></thead><tbody>
    ${docs.map(d => `<tr class="clic" onclick="verDocumento('${d.id}')">
      <td data-l="Fecha">${fCorta(d.fecha)}</td>
      <td class="${conPaciente ? '' : 'prim'}" data-l="Tipo"><span class="tag">${ico(d.tipo === 'orden' ? 'orden' : d.tipo)} ${TIPOS_DOC[d.tipo]}</span></td>
      ${conPaciente ? `<td class="prim">${personaHTML(paciente(d.pac), '')}</td>` : ''}
      <td data-l="Contenido"><span class="t2" style="display:inline-block;max-width:420px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;vertical-align:middle">${esc(resumenDoc(d))}</span></td>
      <td class="derecha" data-l=""><button class="btn btn-linea btn-xs" onclick="event.stopPropagation();imprimir(htmlDocumento(documento('${d.id}')))">${ico('imprimir')} Imprimir</button></td>
    </tr>`).join('')}</tbody></table>`;
}

/* ---------- Sección Documentos ---------- */
RENDER.documentos = function(){
  const [a, b] = rangoPeriodo(docFiltro.periodo), q = normalizar(docFiltro.q.trim());
  const base = D().documentos.filter(d => d.fecha >= a && d.fecha <= b && (!q || normalizar(nombrePac(d.pac)).includes(q)));
  const lista = base.filter(d => !docFiltro.tipo || d.tipo === docFiltro.tipo).sort((x, y) => y.fecha.localeCompare(x.fecha));
  encabezado('Documentos', 'Recetas, certificados y órdenes de estudio, con membrete y listos para imprimir',
    `<button class="btn btn-linea" onclick="formOrden({})">${ico('orden')} Emitir orden</button><button class="btn btn-linea" onclick="formCertificado({})">${ico('certificado')} Emitir certificado</button><button class="btn btn-prim" onclick="formReceta({})">${ico('receta')} Emitir receta</button>`);
  $('#vista').innerHTML = `
    <div class="herr">
      <div class="buscar">${ico('buscar')}<input type="search" placeholder="Buscar paciente…" value="${esc(docFiltro.q)}" oninput="docFiltro.q=this.value;redibujarDocs()" id="doc-q"></div>
      <div class="segmento" style="flex-wrap:wrap">${PERIODOS.map(([k, t]) => `<button class="${docFiltro.periodo === k ? 'on' : ''}" onclick="docFiltro.periodo='${k}';refrescar()">${t}</button>`).join('')}</div>
    </div>
    <div class="pildoras" style="margin-bottom:14px">${[['', 'Todos'], ...Object.entries(TIPOS_DOC)].map(([k, t]) => `<button class="pildora ${docFiltro.tipo === k ? 'on' : ''}" onclick="docFiltro.tipo='${k}';refrescar()">${t} <span class="n">${k ? base.filter(d => d.tipo === k).length : base.length}</span></button>`).join('')}</div>
    <div class="tabla-caja revelar">${lista.length ? tablaDocumentos(lista.slice(0, docFiltro.max), true) + (lista.length > docFiltro.max ? `<div class="mas-filas"><button class="btn btn-linea btn-sm" onclick="docFiltro.max+=100;refrescar()">Ver más (${lista.length - docFiltro.max} restantes)</button></div>` : '')
      : vacio('documentos', 'No hay documentos en este período', 'Emití una receta, un certificado o una orden en un toque.', `<button class="btn btn-prim btn-sm" onclick="formReceta({})">${ico('receta')} Emitir receta</button>`)}</div>`;
};
let _tDoc = null;
function redibujarDocs(){ clearTimeout(_tDoc); _tDoc = setTimeout(() => { const pos = $('#doc-q').selectionStart; refrescar(); const i = $('#doc-q'); i.focus(); i.setSelectionRange(pos, pos); }, 160); }

/* ---------- Encabezado común de los formularios (paciente + alertas) ---------- */
function cabeceraDocForm(pid){
  return `${campo('Paciente', selectorPaciente('pac', pid || ''), { ancho:true })}<div class="campo ancho" id="doc-alertas"></div>`;
}
function pintarAlertasDoc(pid){
  const el = $('#doc-alertas'); if (!el) return;
  const p = pid ? paciente(pid) : null, al = p ? alertasPaciente(p) : [];
  el.innerHTML = al.length ? `<div class="alertas-banda" style="position:static;margin:0">${ico('alerta')}<span class="ab-t">Alertas</span>${al.map(a => `<span class="ab">${esc(a)}</span>`).join('')}</div>` : '';
}
function pacDelForm(f){ return $('.sel-pac input[type=hidden]', f).value; }
function guardarDocumento(tipo, pid, contenido, consultaId, imprimirYa){
  const d = { id:Store.id('d'), tipo, fecha:hoy(), pac:pid, consulta:consultaId || '', contenido };
  D().documentos.push(d); guardar(); cerrarModal(); checkListo();
  avisar(({ receta:'Receta guardada', certificado:'Certificado guardado', orden:'Orden guardada' })[tipo] + ' en la ficha de ' + esc(primerNombre(nombrePac(pid))), tipo);
  refrescar();
  if (imprimirYa) setTimeout(() => imprimir(htmlDocumento(d)), 350);
}

/* ---------- Receta ---------- */
const ALERGIAS_MED = { penicilina:['amoxicilina','penicilina','ampicilina'], aine:['ibuprofeno','diclofenac','naproxeno','ketoprofeno'], sulfa:['sulfa','cotrimoxazol','trimetoprim'], dipirona:['dipirona','metamizol'] };
function choqueAlergia(pid, med){
  const p = pid ? paciente(pid) : null; if (!p || !p.alertas.alergias) return '';
  const al = normalizar(p.alertas.alergias), m = normalizar(med);
  for (const [k, lista] of Object.entries(ALERGIAS_MED)) if (al.includes(k) && lista.some(x => m.includes(x))) return p.alertas.alergias;
  return '';
}
function ultimaReceta(pid){ return D().documentos.filter(d => d.pac === pid && d.tipo === 'receta').sort((a, b) => b.fecha.localeCompare(a.fecha))[0] || null; }
function repetirReceta(pid, consultaId){
  const r = ultimaReceta(pid);
  if (!r){ avisar('Este paciente no tiene recetas anteriores', 'info'); return; }
  formReceta({ pac:pid, consulta:consultaId, items:r.contenido.items, diag:r.contenido.diag, repetida:r.fecha });
}
function filaRx(i){
  i = i || { med:'', ind:'', cant:'' };
  return `<div class="rx-item"><input class="rx-med" placeholder="Medicamento" value="${esc(i.med)}"><input class="rx-ind" placeholder="Indicación" value="${esc(i.ind)}"><input class="rx-cant" placeholder="Cant." value="${esc(i.cant)}">
    <button type="button" class="icon-btn" onclick="this.parentNode.remove();revisarRx()" aria-label="Quitar">${ico('x')}</button></div>`;
}
function formReceta(o){
  o = o || {};
  const items = (o.items && o.items.length) ? o.items : [null];
  abrirModal({ titulo:'Emitir receta', sub:o.repetida ? `Copia de la receta del ${fCorta(o.repetida)} · revisá y listo` : 'Tocá un medicamento frecuente para agregarlo con su dosis habitual', ancho:'ancho',
    cuerpo:`<form class="form" id="f-rx" onsubmit="event.preventDefault()">
      ${cabeceraDocForm(o.pac)}
      <div class="campo ancho"><label>Medicamentos</label><div class="rx-items" id="rx-items">${items.map(filaRx).join('')}</div>
        <button type="button" class="btn btn-suave btn-sm" style="align-self:flex-start;margin-top:6px" onclick="$('#rx-items').insertAdjacentHTML('beforeend', filaRx());revisarRx()">${ico('mas')} Agregar medicamento</button>
        <div id="rx-aviso"></div></div>
      <div class="campo ancho"><label>Medicamentos frecuentes</label>
        <div class="buscar" style="max-width:none;margin-bottom:6px">${ico('buscar')}<input type="search" placeholder="Filtrar…" oninput="filtrarMeds(this.value)"></div>
        <div class="med-lista" id="med-lista">${MEDICAMENTOS.map((m, k) => `<button type="button" class="med-op" data-k="${k}" onclick="agregarMed(${k})"><span><b>${esc(m[0])}</b><br><small>${esc(m[1])}</small></span><span class="tag">${ico('mas')}</span></button>`).join('')}</div></div>
      ${campo('Diagnóstico (opcional)', inp('diag', o.diag || ''))}
      ${campo('Indicaciones generales (opcional)', inp('nota', ''))}
    </form>`,
    pie:`<button class="btn btn-linea" onclick="cerrarModal()">Volver</button><button class="btn btn-linea" onclick="guardarReceta('${o.consulta || ''}')">${ico('ok')} Guardar</button><button class="btn btn-prim" onclick="guardarReceta('${o.consulta || ''}', true)">${ico('imprimir')} Guardar e imprimir</button>`,
    foco:false,
    alAbrir: caja => { activarSelectores(caja, p => { pintarAlertasDoc(p.id); revisarRx(); }); pintarAlertasDoc(o.pac); $('#rx-items').addEventListener('input', revisarRx); revisarRx(); }
  });
}
function filtrarMeds(q){ q = normalizar(q); $$('#med-lista .med-op').forEach(b => b.classList.toggle('hidden', !normalizar(MEDICAMENTOS[b.dataset.k][0]).includes(q))); }
function agregarMed(k){
  const m = MEDICAMENTOS[k];
  let fila = $$('#rx-items .rx-item').find(f => !$('.rx-med', f).value.trim());
  if (!fila){ $('#rx-items').insertAdjacentHTML('beforeend', filaRx()); fila = $$('#rx-items .rx-item').pop(); }
  $('.rx-med', fila).value = m[0]; $('.rx-ind', fila).value = m[1]; $('.rx-cant', fila).value = m[2];
  revisarRx();
}
function itemsRx(){ return $$('#rx-items .rx-item').map(f => ({ med:$('.rx-med', f).value.trim(), ind:$('.rx-ind', f).value.trim(), cant:$('.rx-cant', f).value.trim() })).filter(i => i.med); }
function revisarRx(){
  const pid = pacDelForm($('#f-rx')), r = [];
  itemsRx().forEach(i => { const a = choqueAlergia(pid, i.med); if (a) r.push(`<b>${esc(i.med)}</b>: el paciente es alérgico a ${esc(a)}`); });
  $('#rx-aviso').innerHTML = r.length ? `<div class="alertas-banda" style="position:static;margin:8px 0 0">${ico('alerta')}<span class="ab-t">Atención</span><span class="ab">${r.join('</span><span class="ab">')}</span></div>` : '';
}
async function guardarReceta(consultaId, imp){
  const f = $('#f-rx'), pid = pacDelForm(f), items = itemsRx(), v = leerForm(f);
  if (!pid){ avisar('Elegí el paciente', 'alerta'); return; }
  if (!items.length){ avisar('Agregá al menos un medicamento', 'alerta'); return; }
  const choque = items.find(i => choqueAlergia(pid, i.med));
  if (choque && !await confirmar('Posible alergia', `El paciente tiene registrada alergia a <b>${esc(paciente(pid).alertas.alergias)}</b> y la receta incluye <b>${esc(choque.med)}</b>. ¿Emitirla igual?`, 'Emitir igual', true, 'Revisar')) return;
  guardarDocumento('receta', pid, { items, diag:v.diag, nota:v.nota }, consultaId, imp);
}

/* ---------- Certificado ---------- */
function textoCertificado(sub, p, dias, desde){
  const n = p ? p.nombre : '[paciente]', ci = p && p.ci ? ', CI ' + p.ci : '';
  if (sub === 'reposo') return `Certifico que ${n}${ci}, fue asistido/a en el día de la fecha y requiere reposo domiciliario por ${dias || '__'} días a partir del ${desde ? fCorta(desde) : '__'}, por razones de salud.`;
  if (sub === 'deportivo') return `Certifico que ${n}${ci}, ha sido examinado/a en el día de la fecha y se encuentra en condiciones físicas de realizar actividad deportiva, sin contraindicaciones al examen clínico actual. Válido por un año.`;
  if (sub === 'asistencia') return `Certifico que ${n}${ci}, concurrió a consulta médica en el día de la fecha${p ? '' : ''}.`;
  return '';
}
function formCertificado(o){
  o = o || {};
  abrirModal({ titulo:'Emitir certificado', sub:'El texto se arma solo; podés cambiarlo antes de imprimir', ancho:'medio',
    cuerpo:`<form class="form" id="f-cert" onsubmit="event.preventDefault()">
      ${cabeceraDocForm(o.pac)}
      ${campo('Tipo', opciones('sub', Object.entries(CERTIFICADOS), o.sub || 'reposo'), { ancho:true })}
      ${campo('Días de reposo', inp('dias', 2, 'number', 'min="1"'), { cls:'c-reposo' })}
      ${campo('A partir del', inp('desde', hoy(), 'date'), { cls:'c-reposo' })}
      ${campo('Texto del certificado', area('texto', '', 'rows="5"'), { ancho:true })}
    </form>`,
    pie:`<button class="btn btn-linea" onclick="cerrarModal()">Volver</button><button class="btn btn-linea" onclick="guardarCertificado('${o.consulta || ''}')">${ico('ok')} Guardar</button><button class="btn btn-prim" onclick="guardarCertificado('${o.consulta || ''}', true)">${ico('imprimir')} Guardar e imprimir</button>`,
    foco:false,
    alAbrir: caja => {
      const f = $('#f-cert', caja);
      const armar = () => { const v = leerForm(f), p = paciente(pacDelForm(f)); $$('.c-reposo', f).forEach(e => e.style.display = v.sub === 'reposo' ? '' : 'none'); f.texto.value = textoCertificado(v.sub, p, v.dias, v.desde); };
      activarSelectores(caja, p => { pintarAlertasDoc(p.id); armar(); });
      pintarAlertasDoc(o.pac);
      $$('[name=sub]', f).forEach(r => r.addEventListener('change', armar)); f.dias.addEventListener('input', armar); f.desde.addEventListener('change', armar);
      armar();
    } });
}
function guardarCertificado(consultaId, imp){
  const f = $('#f-cert'), pid = pacDelForm(f), v = leerForm(f);
  if (!pid){ avisar('Elegí el paciente', 'alerta'); return; }
  if (!v.texto){ avisar('Escribí el texto del certificado', 'alerta'); return; }
  guardarDocumento('certificado', pid, { sub:v.sub, dias:v.sub === 'reposo' ? v.dias : '', desde:v.sub === 'reposo' ? v.desde : '', texto:v.texto }, consultaId, imp);
}

/* ---------- Orden de estudios ---------- */
function formOrden(o){
  o = o || {};
  abrirModal({ titulo:'Emitir orden de estudios', sub:'Marcá los estudios que necesitás', ancho:'medio',
    cuerpo:`<form class="form" id="f-ord" onsubmit="event.preventDefault()">
      ${cabeceraDocForm(o.pac)}

      ${campo('Otros estudios (separados por coma)', inp('otros', ''), { ancho:true })}

    pie:`<button class="btn btn-linea" onclick="cerrarModal()">Volver</button><button class="btn btn-linea" onclick="guardarOrden('${o.consulta || ''}')">${ico('ok')} Guardar</button><button class="btn btn-prim" onclick="guardarOrden('${o.consulta || ''}', true)">${ico('imprimir')} Guardar e imprimir</button>`,
    foco:false,

}
function guardarOrden(consultaId, imp){
  const f = $('#f-ord'), pid = pacDelForm(f), v = leerForm(f);

/* ===== js/16-estadisticas.js ===== */
/* =====================================================================
   ESTADÍSTICAS · diagnósticos más frecuentes, ausentismo,
   pacientes nuevos por mes e ingresos
   ===================================================================== */
let estPeriodo = 12;   // meses hacia atrás (incluye el actual)

RENDER.estadisticas = function(){
  const h = hoy(), desde = sumarMeses(inicioMes(h), -(estPeriodo - 1));
  const cons = D().consultas.filter(c => c.fecha >= desde && c.fecha <= h);
  const tur = D().turnos.filter(t => t.fecha >= desde && t.fecha <= h);
  const aten = tur.filter(t => t.estado === 'atendido').length, aus = tur.filter(t => t.estado === 'ausente').length;
  const nuevos = D().pacientes.filter(p => p.alta >= desde && p.alta <= h);
  const cobrado = suma(cobradoEntre(desde, h));
  const distintos = new Set(cons.map(c => c.pac)).size;
  const meses = Array.from({ length:estPeriodo }, (_, i) => sumarMeses(inicioMes(h), -(estPeriodo - 1 - i)));
  // Diagnósticos
  const dx = {};
  cons.forEach(c => { const k = c.dx && (c.dx.cod || c.dx.txt); if (k) dx[k] = dx[k] || { cod:c.dx.cod, l:dxTexto(c.dx), v:0 }; if (k) dx[k].v++; });
  const topDx = Object.values(dx).sort((a, b) => b.v - a.v).slice(0, 10);
  // Por mes
  const porMes = meses.map(m0 => {
    const m1 = finMes(m0), t = tur.filter(x => x.fecha >= m0 && x.fecha <= m1);
    const a = t.filter(x => x.estado === 'atendido').length, u = t.filter(x => x.estado === 'ausente').length;
    return { m0, l:MESES_C[aFecha(m0).getMonth()], aus: a + u ? u / (a + u) * 100 : 0, nuevos:nuevos.filter(p => p.alta >= m0 && p.alta <= m1).length, cons:a, act:m0 === inicioMes(h) };
  });
  const tipos = Object.entries(TIPOS_TURNO).map(([k, x]) => ({ l:x.corto, v:cons.filter(c => c.tipo === k).length })).sort((a, b) => b.v - a.v);
  // Mejoría del dolor: EVA de la primera consulta del período contra la última, por paciente
  const porPac = {};
  cons.slice().sort((a, b) => a.fecha.localeCompare(b.fecha)).forEach(c => { if (c.sv && c.sv.eva !== '' && c.sv.eva != null){ (porPac[c.pac] = porPac[c.pac] || []).push(Number(c.sv.eva)); } });
  const pares = Object.values(porPac).filter(l => l.length >= 2);
  const evaIni = pares.length ? pares.reduce((s, l) => s + l[0], 0) / pares.length : 0, evaFin = pares.length ? pares.reduce((s, l) => s + l[l.length - 1], 0) / pares.length : 0;
  const mejoraron = pares.filter(l => l[l.length - 1] <= l[0] - 2).length;
  const cob = Object.entries(COBERTURAS).map(([k, t]) => ({ l:t, v:[...new Set(cons.map(c => c.pac))].filter(id => { const p = paciente(id); return p && p.cobertura === k; }).length }));
  const cron = Object.entries(ETIQUETAS).map(([k, t]) => ({ l:t, v:D().pacientes.filter(p => p.etiquetas.includes(k)).length })).filter(x => x.v).sort((a, b) => b.v - a.v);

  encabezado('Estadísticas', `Del ${fCorta(desde)} al ${fCorta(h)}`,
    `<div class="segmento">${[[3, '3 meses'], [6, '6 meses'], [12, '12 meses']].map(([n, t]) => `<button class="${estPeriodo === n ? 'on' : ''}" onclick="estPeriodo=${n};refrescar()">${t}</button>`).join('')}</div>`);
  $('#vista').innerHTML = `
    <div class="grid g-4 kpis">
      <div class="kpi revelar"><div class="kpi-l">${ico('estetoscopio')} Consultas</div><div class="kpi-v">${fmtNum.format(cons.length)}</div><div class="kpi-d">${fmtNum.format(distintos)} pacientes distintos</div></div>
      <div class="kpi revelar ${aus / Math.max(1, aten + aus) > .1 ? 'alerta' : ''}"><div class="kpi-l">${ico('ausente')} Ausentismo</div><div class="kpi-v">${pct(aten + aus ? aus / (aten + aus) * 100 : 0)}</div><div class="kpi-d">${aus} turnos sin aviso de ${aten + aus}</div></div>
      <div class="kpi revelar"><div class="kpi-l">${ico('usuario')} Pacientes nuevos</div><div class="kpi-v">${nuevos.length}</div><div class="kpi-d">${(nuevos.length / estPeriodo).toFixed(1).replace('.', ',')} por mes en promedio</div></div>
      <div class="kpi revelar"><div class="kpi-l">${ico('honorarios')} Promedio por consulta</div><div class="kpi-v">${pesos(cons.length ? cobrado / cons.length : 0)}</div><div class="kpi-d">${pesos(cobrado)} cobrados en total</div></div>
    </div>
    <div class="grid g-2 mt">
      <div class="card revelar"><div class="card-cab"><div class="card-t">${ico('historia')} Diagnósticos más frecuentes</div><span class="muted chico">CIE-10</span></div>
        ${topDx.length ? barrasH(topDx) : vacio('historia', 'Sin consultas en el período')}</div>
      <div class="grid" style="align-content:start">
        <div class="card revelar"><div class="card-cab"><div class="card-t">${ico('ausente')} Ausentismo por mes</div></div>
          ${graficoBarras(porMes.map(m => ({ l:m.l, v:Math.round(m.aus), act:m.act })), { formato:v => Math.round(v) + '%', alto:190, titulo:'Porcentaje de ausentismo por mes' })}</div>
        <div class="card revelar"><div class="card-cab"><div class="card-t">${ico('usuario')} Pacientes nuevos por mes</div></div>
          ${graficoBarras(porMes.map(m => ({ l:m.l, v:m.nuevos, act:m.act })), { formato:v => String(Math.round(v)), alto:190, titulo:'Pacientes nuevos por mes' })}</div>
      </div>
    </div>
    <div class="grid g-3 mt">
      <div class="card revelar"><div class="card-t" style="margin-bottom:14px">${ico('agenda')} Consultas por servicio</div>${barrasH(tipos)}</div>
      <div class="card revelar"><div class="card-t" style="margin-bottom:14px">${ico('escudo')} Cobertura de los pacientes atendidos</div>${barrasH(cob)}</div>
      <div class="card revelar"><div class="card-t" style="margin-bottom:14px">${ico('etiqueta')} Pacientes en seguimiento</div>${cron.length ? barrasH(cron) : vacio('pacientes', 'Sin pacientes en seguimiento')}
        <button class="link mt" onclick="pacFiltro.et='cronicos';ir('pacientes')">Ver la lista de seguimiento ${ico('der')}</button></div>
    </div>
    <div class="card revelar mt"><div class="card-cab"><div class="card-t">${ico('pulso')} Resultados: mejoría del dolor</div><span class="muted chico">Escala EVA de 0 a 10</span></div>
      ${pares.length ? `<div class="grid g-3">
        <div class="medio"><div class="l">Dolor promedio al empezar</div><div class="v">${fmtDec.format(evaIni)} / 10</div></div>
        <div class="medio"><div class="l">Dolor promedio en la última consulta</div><div class="v verde">${fmtDec.format(evaFin)} / 10</div></div>
        <div class="medio"><div class="l">Pacientes que mejoraron 2 puntos o más</div><div class="v">${pct(mejoraron / pares.length * 100)}</div><div class="d">${mejoraron} de ${pares.length} pacientes en tratamiento</div></div>
      </div>` : vacio('historia', 'Todavía no hay datos suficientes')}</div>
    <div class="card revelar mt"><div class="card-cab"><div class="card-t">${ico('grafico')} Consultas atendidas por mes</div></div>
      ${graficoBarras(porMes.map(m => ({ l:m.l, v:m.cons, act:m.act })), { formato:v => String(Math.round(v)), alto:200, titulo:'Consultas atendidas por mes' })}</div>`;
  animarBarrasH();
};

          <form class="form" id="f-ar">${Object.entries(TIPOS_TURNO).map(([k, t]) => campo(t.t, inp(k, c.aranceles[k], 'number', 'min="0" step="50"'), { ayuda:esc(t.d) + ' · ' + t.dur + ' min' + (t.sesiones ? ' · por sesiones' : '') })).join('')}</form>
          <div class="cfg-acc"><button class="btn btn-prim" onclick="guardarAranceles()">${ico('ok')} Guardar aranceles</button><span class="muted chico" style="align-self:center">Se usan al generar el honorario de cada consulta.</span></div>
        </div>
        <div class="card revelar"><div class="card-cab"><div class="card-t">${ico('candado')} Contraseña de ingreso</div></div>
          <form class="form f3" id="f-clave" onsubmit="event.preventDefault();guardarClave()">
            ${campo('Contraseña actual', inp('actual', '', 'password', 'autocomplete="current-password"'))}
            ${campo('Contraseña nueva', inp('nuevo', '', 'password', 'autocomplete="new-password"'))}
            ${campo('Repetir la nueva', inp('repetir', '', 'password', 'autocomplete="new-password"'))}
          </form>
          <div class="cfg-acc"><button class="btn btn-prim" onclick="guardarClave()">${ico('ok')} Cambiar contraseña</button><span class="muted chico" style="align-self:center">Mínimo 4 caracteres. En la demostración es 1234.</span></div>
        </div>
      </div>
    </div>
    <div class="grid g-2 mt">
      <div class="card revelar"><div class="card-cab"><div class="card-t">${ico('reloj')} Horario de atención</div></div>
        <div id="f-hor">${orden.map(k => { const h = c.horario[k]; return `<div class="hor-fila" data-d="${k}">
          <b class="dia" style="text-transform:capitalize">${DIAS[k]}</b>
          <div class="campo check"><label><input type="checkbox" class="h-on" ${h ? 'checked' : ''} onchange="this.closest('.hor-fila').querySelectorAll('input[type=time]').forEach(i=>i.disabled=!this.checked)"> Atiende</label></div>
          <input type="time" class="h-a" value="${h ? h[0] : '09:00'}" ${h ? '' : 'disabled'} step="900" aria-label="Desde">
          <input type="time" class="h-b" value="${h ? h[1] : '13:00'}" ${h ? '' : 'disabled'} step="900" aria-label="Hasta"></div>`; }).join('')}</div>
        <div class="cfg-acc"><button class="btn btn-prim" onclick="guardarHorario()">${ico('ok')} Guardar horario</button><span class="muted chico" style="align-self:center">Fuera de este horario, la agenda avisa antes de agendar.</span></div>

          <div class="cfg-acc"><button class="btn btn-prim" onclick="guardarMensaje()">${ico('ok')} Guardar mensaje</button></div>
        </div>

function guardarDoctora(){
  const v = leerForm($('#f-doc'));
  if (!v.nombre){ avisar('Escribí el nombre', 'alerta'); return; }
  Object.assign(cfg().doctora, v); guardar(); armarMarco(); checkListo(); avisar('Datos guardados', 'usuario'); refrescar();
}
function guardarAranceles(){
  const v = leerForm($('#f-ar'));
  Object.keys(TIPOS_TURNO).forEach(k => cfg().aranceles[k] = Number(v[k]) || 0);
  guardar(); checkListo(); avisar('Aranceles actualizados', 'honorarios');
}
function guardarHorario(){
  const h = [null, null, null, null, null, null, null];
  for (const f of $$('#f-hor .hor-fila')){
    if (!$('.h-on', f).checked) continue;
    const a = $('.h-a', f).value, b = $('.h-b', f).value;
    if (!a || !b || a >= b){ avisar('Revisá el horario del ' + DIAS[f.dataset.d] + ': el inicio tiene que ser antes del final', 'alerta'); return; }
    h[f.dataset.d] = [a, b];
  }
  cfg().horario = h; guardar(); checkListo(); avisar('Horario guardado', 'reloj');
}
function guardarMensaje(){ cfg().mensajeWA = $('#f-wa').mensajeWA.value.trim() || CONFIG_INICIAL.mensajeWA; guardar(); checkListo(); avisar('Mensaje guardado', 'wa'); }
function guardarClave(){
  const f = $('#f-clave'), v = { actual:f.actual.value, nuevo:f.nuevo.value, repetir:f.repetir.value };
  if (v.actual !== String(cfg().clave)){ avisar('La contraseña actual no es correcta', 'alerta'); return; }
  if (v.nuevo.length < 4){ avisar('La contraseña nueva tiene que tener al menos 4 caracteres', 'alerta'); return; }
  if (v.nuevo !== v.repetir){ avisar('Las dos contraseñas nuevas no coinciden', 'alerta'); return; }
  cfg().clave = v.nuevo; guardar(); checkListo(); avisar('Contraseña cambiada. Usala la próxima vez que ingreses.', 'candado'); refrescar();
}
function exportarCopia(){
  descargar(nombreCentro() + ' - copia de seguridad - ' + hoy() + '.json', JSON.stringify(D(), null, 1), 'application/json');
  avisar('Se descargó la copia de seguridad', 'descargar');
}
function importarCopia(input){
  const f = input.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = async () => {
    let d = null;
    try { d = JSON.parse(r.result); } catch (e) { d = null; }
    input.value = '';
    if (!d || !Array.isArray(d.pacientes) || !Array.isArray(d.turnos) || !Array.isArray(d.consultas) || !d.config){ avisar('Ese archivo no es una copia de seguridad válida', 'alerta'); return; }
    if (!await confirmar('¿Recuperar esta copia?', `Tiene ${d.pacientes.length} pacientes y ${d.consultas.length} consultas. <b>Reemplaza todos los datos actuales.</b>`, 'Recuperar copia', true)) return;
    ['honorarios', 'documentos'].forEach(k => d[k] = d[k] || []);
    d.version = VERSION_DATOS; d.tocado = true; migrarDatos(d); d.base = d.base || hoy();
    Store.data = d; if (d.base !== hoy()) moverFechas(d, hoy()); Store.escribir();
    armarMarco(); checkListo(); avisar('Copia recuperada', 'subir'); refrescar();
  };
  r.readAsText(f);
}
async function restablecerDemo(){
  if (!await confirmar('¿Volver a los datos de ejemplo?', 'Se borra todo lo que cargaste en esta demostración y vuelven los pacientes inventados.', 'Volver a empezar', true)) return;
  Store.data = crearDatosEjemplo(hoy()); Store.escribir(); _inicioAnimado = false;
  armarMarco(); avisar('Listo: datos de ejemplo restablecidos', 'repetir'); ir('inicio');
}

document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if (!$('#dialogo').classList.contains('hidden')) $('#dlg-no').click();
  else if (!$('#buscador').classList.contains('hidden')) cerrarBuscador();
  else if (modalAbierto()) cerrarModal();
});
$('#modal').addEventListener('mousedown', e => { if (e.target.id === 'modal') cerrarModal(); });
$('#buscador').addEventListener('mousedown', e => { if (e.target.id === 'buscador') cerrarBuscador(); });

armarMarco();

mostrarBloqueo();
