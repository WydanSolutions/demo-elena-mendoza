   La página abre directo acá (sin la presentación de Wydan, decisión del 25/09/2026).
   El botón "Bloquear" vuelve a esta pantalla y tapa TODO lo que hay detrás
   (incluso una consulta a medio escribir, que no se pierde): sirve para cuando
   la doctora se levanta con el paciente adelante.
   IMPORTANTE: en la demostración la contraseña se guarda en el navegador y es un
   bloqueo VISUAL. En la versión real, el ingreso es con Firebase Authentication
   (correo y contraseña) y los permisos se controlan en firestore.rules.

function mostrarBloqueo(){
  $('#bq-logo').innerHTML = logoCompleto();
  $('#bq-wydan').src = LOGO_WYDAN_ICONO;
  $('#bq-saludo').textContent = saludoHora() + ', ' + nombreDoctora(true);

  $('#bq-ojo').innerHTML = ico('ojo');
  $('#bq-pass').type = 'password'; $('#bq-pass').value = '';
  $('#bq-error').textContent = '';
  $('#app').classList.add('hidden');
  $('#bloqueo').classList.remove('hidden', 'saliendo');
  $('#bloqueo').scrollTop = 0;
  if (window.innerWidth > 700) setTimeout(() => $('#bq-pass').focus(), 120);
}
function alternarClave(){
  const i = $('#bq-pass'), ver = i.type === 'password';
  i.type = ver ? 'text' : 'password';
  $('#bq-ojo').innerHTML = ico(ver ? 'ojoNo' : 'ojo');
  $('#bq-ojo').setAttribute('aria-label', ver ? 'Ocultar contraseña' : 'Mostrar contraseña');
  i.focus();
}
function intentarIngreso(){
  const i = $('#bq-pass'), t = $('#bq-form');
  if (i.value === String(cfg().clave)){
    $('#bq-error').textContent = '';
    i.blur();
    $('#bloqueo').classList.add('saliendo');
    setTimeout(() => { $('#bloqueo').classList.add('hidden'); abrirApp(); }, 520);

    i.select();
  }
}
function bloquear(){ cerrarBuscador(); mostrarBloqueo(); }

let _reloj = null;

/* ---------- Buscador general ---------- */
let _busSel = 0, _busRes = [];
function abrirBuscador(){
  if ($('#app').classList.contains('hidden')) return;
  $('#buscador').classList.remove('hidden');
  $('#bus-input').value = ''; buscarGeneral();
  setTimeout(() => $('#bus-input').focus(), 30);
}
function cerrarBuscador(){ $('#buscador').classList.add('hidden'); }
function buscarGeneral(){
  const q = normalizar($('#bus-input').value.trim()), qd = soloDigitos(q);
  const deu = deudas();
  if (!q){
    const hoyP = turnosDelDia(hoy()).map(t => paciente(t.pac)).filter(Boolean);
    _busRes = hoyP.filter((p, i) => hoyP.indexOf(p) === i).slice(0, 8);
  } else {
    _busRes = pacientesOrden().filter(p => normalizar(p.nombre).includes(q) || (qd.length >= 3 && soloDigitos(p.ci).includes(qd))).slice(0, 10);
  }
  _busSel = 0;
  $('#bus-res').innerHTML = (!q && _busRes.length ? '<div class="muted chico" style="padding:6px 12px">Pacientes de hoy</div>' : '') +
    (_busRes.length ? _busRes.map((p, i) => `<button class="bus-item ${i === 0 ? 'sel' : ''}" onclick="elegirBusqueda(${i})" onmousemove="marcarBusqueda(${i})">
      ${avatar(p)}<div style="min-width:0"><div class="persona-n">${esc(p.nombre)}</div><div class="persona-s">CI ${esc(p.ci)} · ${edad(p.nac)} años</div></div>
      <span class="der">${chipAlertas(p)}${chipDeuda(deu[p.id] || 0)}</span></button>`).join('')
    : `<div class="bus-vacio">No hay pacientes con «${esc($('#bus-input').value)}».<br><button class="btn btn-suave btn-sm mt-s" onclick="cerrarBuscador();formPaciente()">${ico('mas')} Nuevo paciente</button></div>`);
}
function marcarBusqueda(i){ _busSel = i; $$('.bus-item', $('#bus-res')).forEach((b, k) => b.classList.toggle('sel', k === i)); }
function elegirBusqueda(i){ const p = _busRes[i]; if (!p) return; cerrarBuscador(); if (modalAbierto()) cerrarModal(); abrirFicha(p.id); }
document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k'){ e.preventDefault(); abrirBuscador(); return; }
  if ($('#buscador').classList.contains('hidden')) return;
  if (e.key === 'ArrowDown'){ e.preventDefault(); marcarBusqueda(Math.min(_busRes.length - 1, _busSel + 1)); }
  else if (e.key === 'ArrowUp'){ e.preventDefault(); marcarBusqueda(Math.max(0, _busSel - 1)); }
  else if (e.key === 'Enter'){ e.preventDefault(); elegirBusqueda(_busSel); }
});


/* ===== js/07-graficos.js ===== */
/* =====================================================================
   GRÁFICOS SIMPLES (SVG, sin librerías)
   Las líneas "se dibujan" al entrar y las barras crecen (CSS).
   ===================================================================== */

// Barras verticales. datos: [{ l:'ene', v:1234, act:true }]
function graficoBarras(datos, o){
  o = Object.assign({ ancho:600, alto:210, formato:v => pesosCorto(v) }, o);
  const pl = 8, pr = 8, pt = 22, pb = 26, W = o.ancho, H = o.alto;
  const max = Math.max(1, ...datos.map(x => x.v)) * 1.12;
  const bw = (W - pl - pr) / datos.length;
  const y = v => pt + (H - pt - pb) * (1 - v / max);
  const barras = datos.map((x, i) => {
    const bx = pl + i * bw + bw * .2, w = bw * .6, by = y(x.v), bh = H - pb - by;
    return `<g><rect class="barra ${x.act ? 'act' : ''}" x="${bx}" y="${by}" width="${w}" height="${Math.max(0, bh)}" rx="5" style="animation-delay:${i * 60}ms"><title>${esc(x.l)}: ${esc(o.formato(x.v))}</title></rect>
      <text class="val" x="${bx + w / 2}" y="${by - 6}" text-anchor="middle">${esc(o.formato(x.v))}</text>
      <text x="${bx + w / 2}" y="${H - 8}" text-anchor="middle">${esc(x.l)}</text></g>`;
  }).join('');
  return `<div class="graf"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.titulo || 'Gráfico de barras')}">
    <line class="eje" x1="${pl}" x2="${W - pr}" y1="${H - pb}" y2="${H - pb}"/>${barras}</svg></div>`;
}

// Líneas. series: [{ n:'Sistólica', cls:'', pts:[{ f:'2026-01-10', v:140 }] }]. Eje X por fecha.
function graficoLineas(series, o){
  o = Object.assign({ ancho:620, alto:230, formato:v => fmtDec.format(v), unidad:'' }, o);
  const pl = 40, pr = 14, pt = 16, pb = 28, W = o.ancho, H = o.alto;
  const todos = series.flatMap(s => s.pts);
  if (todos.length < 2) return vacio('historia', 'Todavía no hay suficientes datos', 'El gráfico aparece a partir de dos consultas con este dato.');
  const fechas = todos.map(p => p.f).sort();
  const f0 = aFecha(fechas[0]).getTime(), f1 = Math.max(f0 + 864e5, aFecha(fechas[fechas.length - 1]).getTime());
  let vmin = Math.min(...todos.map(p => p.v)), vmax = Math.max(...todos.map(p => p.v));
  if (o.banda){ vmin = Math.min(vmin, o.banda[0]); vmax = Math.max(vmax, o.banda[1]); }
  const m = (vmax - vmin) * .15 || 5; vmin -= m; vmax += m;
  if (o.piso != null) vmin = Math.max(vmin, o.piso);
  if (o.techo != null) vmax = Math.min(vmax, o.techo);
  const x = f => pl + (W - pl - pr) * (aFecha(f).getTime() - f0) / (f1 - f0);
  const y = v => pt + (H - pt - pb) * (1 - (v - vmin) / (vmax - vmin));
  const guias = [0, .25, .5, .75, 1].map(k => { const v = vmin + (vmax - vmin) * k; return `<line class="guia" x1="${pl}" x2="${W - pr}" y1="${y(v)}" y2="${y(v)}"/><text x="${pl - 6}" y="${y(v) + 4}" text-anchor="end">${Math.round(v)}</text>`; }).join('');
  const banda = o.banda ? `<rect class="banda" x="${pl}" y="${y(o.banda[1])}" width="${W - pl - pr}" height="${y(o.banda[0]) - y(o.banda[1])}"/>` : '';
  // Etiquetas del eje X: primera, última y algunas del medio
  const unicas = [...new Set(fechas)];
  const paso = Math.max(1, Math.ceil(unicas.length / 5));
  const ejeX = unicas.filter((f, i) => i % paso === 0 || i === unicas.length - 1).map(f => `<text x="${x(f)}" y="${H - 8}" text-anchor="middle">${fMedia(f)}</text>`).join('');
  const lineas = series.map((s, k) => {
    const pts = s.pts.slice().sort((a, b) => a.f.localeCompare(b.f));
    const d = pts.map((p, i) => (i ? 'L' : 'M') + x(p.f).toFixed(1) + ' ' + y(p.v).toFixed(1)).join(' ');
    const area = k === 0 && series.length === 1 ? `<path class="area" d="${d} L${x(pts[pts.length - 1].f).toFixed(1)} ${H - pb} L${x(pts[0].f).toFixed(1)} ${H - pb}Z"/>` : '';
    return area + `<path class="linea ${s.cls || ''}" pathLength="1" d="${d}"/>` +
      pts.map(p => `<circle class="punto ${s.cls || ''}" cx="${x(p.f)}" cy="${y(p.v)}" r="3.6"><title>${fCorta(p.f)} · ${s.n}: ${o.formato(p.v)} ${o.unidad}</title></circle>`).join('');
  }).join('');
  return `<div class="graf"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.titulo || 'Gráfico de evolución')}">${banda}${guias}${ejeX}${lineas}</svg></div>`;
}

// Barras horizontales (ranking)
function barrasH(filas, formato){
  const max = Math.max(1, ...filas.map(f => f.v));
  return `<div class="barras-h">` + filas.map(f => `<div class="bh"><div class="bh-t">${f.cod ? `<b>${esc(f.cod)}</b>` : ''}${esc(f.l)}</div><div class="bh-v">${formato ? formato(f.v) : f.v}</div>
    <div class="bh-b"><i data-w="${Math.round(f.v / max * 100)}"></i></div></div>`).join('') + `</div>`;
}
// Las barras horizontales crecen después de dibujarse
function animarBarrasH(){ requestAnimationFrame(() => requestAnimationFrame(() => $$('.bh-b i[data-w]').forEach(i => i.style.width = i.dataset.w + '%'))); }


/* ===== js/08-inicio.js ===== */
/* =====================================================================
   INICIO · resumen del día
   ===================================================================== */
let _inicioAnimado = false;   // los números suben una sola vez por sesión

function proximoPaciente(){
  const h = hoy(), ahora = ahoraMin();
  const delDia = turnosDelDia(h);
  return delDia.find(t => t.estado === 'espera') ||
    delDia.find(t => t.estado === 'confirmado' && minutos(t.hora) >= ahora - 30) ||
    D().turnos.filter(t => t.fecha > h && t.estado === 'confirmado').sort(ordenTurno)[0] || null;
}

RENDER.inicio = function(){
  const h = hoy(), delDia = turnosDelDia(h);
  const activos = delDia.filter(t => t.estado !== 'cancelado');
  const atendidos = delDia.filter(t => t.estado === 'atendido').length;
  const espera = delDia.filter(t => t.estado === 'espera').length;
  const cobHoy = suma(cobradoEntre(h, h));
  const cobMes = suma(cobradoEntre(inicioMes(h), h));
  const deu = deudas(), nDeben = Object.keys(deu).length, totDeuda = Object.values(deu).reduce((s, v) => s + v, 0);
  const ctrl = controlesPendientes();
  const vencidos = ctrl.filter(c => c.dias < 0).length;

  encabezado(saludoHora() + ', ' + nombreDoctora(true),
    activos.length ? `Hoy tenés <b>${activos.length} turnos</b>${espera ? ` · <span class="naranja fuerte">${espera} en sala de espera</span>` : ''}.` : 'Hoy no tenés turnos agendados.',
    `<button class="btn btn-linea" onclick="formPaciente()">${ico('usuario')} Nuevo paciente</button><button class="btn btn-prim" onclick="formTurno({fecha:hoy()})">${ico('mas')} Nuevo turno</button>`);

  const px = proximoPaciente();
  $('#vista').innerHTML = `
    <div class="grid g-4 kpis">
      <button class="kpi revelar" onclick="ir('agenda')"><div class="kpi-l">${ico('agenda')} Turnos de hoy</div>
        <div class="kpi-v"><span data-n="${atendidos}">${atendidos}</span> <small>/ ${activos.length} atendidos</small></div>
        <div class="barrita"><i style="width:${activos.length ? Math.round(atendidos / activos.length * 100) : 0}%"></i></div></button>
      <button class="kpi revelar" onclick="ir('honorarios')"><div class="kpi-l">${ico('honorarios')} Cobrado hoy</div>
        <div class="kpi-v" data-p="${cobHoy}">${pesos(cobHoy)}</div><div class="kpi-d">${cobradoEntre(h, h).length} cobros</div></button>
      <button class="kpi revelar" onclick="ir('honorarios')"><div class="kpi-l">${ico('grafico')} Cobrado en ${MESES[aFecha(h).getMonth()]}</div>
        <div class="kpi-v" data-p="${cobMes}">${pesos(cobMes)}</div><div class="kpi-d">al ${aFecha(h).getDate()} de ${MESES[aFecha(h).getMonth()]}</div></button>
      <button class="kpi revelar ${totDeuda ? 'alerta' : ''}" onclick="honFiltro.estado='pendiente';honFiltro.periodo='todo';ir('honorarios')"><div class="kpi-l">${ico('reloj')} Pendiente de cobro</div>
        <div class="kpi-v" data-p="${totDeuda}">${pesos(totDeuda)}</div><div class="kpi-d">${nDeben === 1 ? '1 paciente debe' : nDeben + ' pacientes deben'}</div></button>
    </div>

    <div class="grid g-21 mt">
      <div class="grid" style="align-content:start">
        ${tarjetaProximo(px)}
        <div class="card revelar">
          <div class="card-cab"><div class="card-t">${ico('agenda')} Turnos de hoy <span class="card-num">${activos.length}</span></div>
            <button class="link" onclick="agenda.vista='dia';agenda.fecha=hoy();ir('agenda')">Ver en la agenda ${ico('der')}</button></div>
          ${delDia.length ? `<div class="lt">${delDia.map(t => filaTurnoHoy(t, deu)).join('')}</div>`
            : vacio('agenda', 'La agenda de hoy está libre', 'Podés agendar un turno en un toque.', `<button class="btn btn-prim btn-sm" onclick="formTurno({fecha:hoy()})">${ico('mas')} Nuevo turno</button>`)}
        </div>
      </div>
      <div class="grid" style="align-content:start">
        <div class="card revelar">
          <div class="card-cab"><div class="card-t">${ico('bandera')} Controles vencidos o próximos ${vencidos ? `<span class="chip e-mal sin-punto">${vencidos} vencidos</span>` : ''}</div></div>
          ${ctrl.length ? `<div>${ctrl.slice(0, 7).map(filaControl).join('')}</div>
            ${ctrl.length > 7 ? `<div class="mas-filas" style="border:none;padding-bottom:0"><button class="link" onclick="verControles()">Ver los ${ctrl.length} controles ${ico('der')}</button></div>` : ''}`
            : vacio('ok', 'Todos al día', 'No hay controles vencidos ni próximos.')}
        </div>
        <div class="card revelar">
          <div class="card-cab"><div class="card-t">${ico('grafico')} Ingresos de los últimos 6 meses</div></div>
          ${graficoBarras(ingresosMeses(6), { titulo:'Ingresos cobrados por mes' })}
        </div>
      </div>
    </div>`;

  if (!_inicioAnimado){
    _inicioAnimado = true;
    $$('#vista [data-p]').forEach(el => contarHasta(el, Number(el.dataset.p), pesos));
    $$('#vista [data-n]').forEach(el => contarHasta(el, Number(el.dataset.n), v => Math.round(v)));
  }
  iniciarReloj(() => { if (!modalAbierto() && seccionActual === 'inicio') refrescar(); }, 60000);
};

function tarjetaProximo(t){
  if (!t) return `<div class="proximo vacio-px revelar"><div class="px-l">${ico('reloj')} Próximo paciente</div>
    <div class="px-cuerpo"><div><div class="px-nom">No quedan pacientes por atender</div><div class="px-det">Cuando agendes un turno, aparece acá.</div></div></div>
    <div class="px-acc"><button class="btn btn-blanco" onclick="formTurno({fecha:hoy()})">${ico('mas')} Nuevo turno</button></div></div>`;
  const p = paciente(t.pac), al = alertasPaciente(p), deuda = deudaDe(p.id), u = consultasDe(p.id)[0];
  const esHoy = t.fecha === hoy();
  return `<div class="proximo revelar">
    <div class="px-l">${ico(t.estado === 'espera' ? 'sala' : 'reloj')} ${t.estado === 'espera' ? 'En sala de espera' : 'Próximo paciente'}</div>
    <div class="px-cuerpo">
      <div class="px-hora">${t.hora}<small>${esHoy ? 'hoy' : fLarga(t.fecha)} · ${t.dur} min</small></div>
      <div class="px-sep"></div>
      <div style="min-width:0">
        <div class="px-nom">${esc(p.nombre)}</div>
        <div class="px-det">${edad(p.nac)} años · ${TIPOS_TURNO[t.tipo].t}${t.nota ? ' · ' + esc(t.nota) : ''}</div>
        <div class="px-det">${u ? 'Última consulta ' + cuando(u.fecha) + ': ' + esc(dxTexto(u.dx) || u.motivo) : 'Primera consulta'}</div>
      </div>
    </div>
    ${al.length || deuda ? `<div class="px-alertas">${al.map(a => `<span class="chip sin-punto">${ico('alerta')} ${esc(a)}</span>`).join('')}${deuda ? `<span class="chip sin-punto" style="background:var(--pend-bg);color:var(--pend)">Debe ${pesos(deuda)}</span>` : ''}</div>` : ''}
    <div class="px-acc">
      ${esHoy ? `<button class="btn btn-blanco" onclick="atender('${t.id}', this.closest('.proximo'))">${ico('estetoscopio')} Atender</button>` : ''}
      <button class="btn btn-trans" onclick="abrirFicha('${p.id}')">${ico('usuario')} Ver ficha</button>
      ${esHoy && t.estado === 'confirmado' ? `<button class="btn btn-trans" onclick="cambiarEstado('${t.id}','espera')">${ico('sala')} Llegó</button>` : ''}
    </div></div>`;
}

function filaTurnoHoy(t, deu){
  const p = paciente(t.pac), ahora = ahoraMin();
  const pasado = finTurno(t) <= ahora && t.estado !== 'espera';
  let acc = '';
  if (t.estado === 'confirmado') acc = `<button class="btn btn-linea btn-xs" onclick="cambiarEstado('${t.id}','espera')">${ico('sala')} Llegó</button><button class="btn btn-prim btn-xs" onclick="atender('${t.id}', this.closest('.lt-item'))">${ico('estetoscopio')} Atender</button>`;
  else if (t.estado === 'espera') acc = `<button class="btn btn-prim btn-xs" onclick="atender('${t.id}', this.closest('.lt-item'))">${ico('estetoscopio')} Atender</button>`;
  else if (t.estado === 'atendido' && t.consulta) acc = `<button class="btn btn-suave btn-xs" onclick="verConsulta('${t.consulta}')">${ico('nota')} Ver consulta</button>`;
  return `<div class="lt-item ${pasado ? 'pasado' : ''} ${t.estado === 'espera' ? 'en-espera' : ''}">
    <div class="lt-hora">${t.hora}<small>${t.dur} min</small></div>
    <button style="text-align:left;min-width:0" onclick="verTurno('${t.id}')">${personaHTML(p, TIPOS_TURNO[t.tipo].t + (t.nota ? ' · ' + esc(t.nota) : ''))}
      <div class="persona-chips" style="padding-left:49px">${chipTurno(t.estado)}${chipAlertas(p)}${chipDeuda(deu[p.id] || 0)}</div></button>
    <div class="lt-acc">${acc}</div>
  </div>`;
}

function filaControl(c){
  const venc = c.dias < 0;
  return `<div class="ctrl-item">
    <button style="text-align:left;min-width:0;flex:1 1 190px" onclick="abrirFicha('${c.pac.id}')">${personaHTML(c.pac, esc(dxTexto(c.consulta.dx) || 'Control'))}</button>
    <div class="der">
      <span class="chip ${venc ? 'e-mal' : 'e-pend'}">${venc ? 'Vencido ' + cuando(c.fecha) : 'Le toca ' + cuando(c.fecha)}</span>
      <button class="icon-btn" title="Recordar por WhatsApp" aria-label="Recordar por WhatsApp" onclick="whatsappControl('${c.pac.id}')">${ico('wa')}</button>
      <button class="btn btn-suave btn-xs" onclick="formTurno({pac:'${c.pac.id}', tipo:'control'})">${ico('mas')} Agendar</button>
    </div></div>`;
}
function verControles(){
  const ctrl = controlesPendientes();
  abrirModal({ titulo:'Controles vencidos o próximos', sub:'Pacientes que tenían que volver y todavía no tienen turno', ancho:'medio',
    cuerpo: ctrl.map(filaControl).join('') });
}
function whatsappControl(pid){
  const p = paciente(pid);
  enviarWhatsApp(p, `Hola ${primerNombre(p.nombre)} 👋 Le escribimos de ${nombreCentro()}. Ya le corresponde su control con el ${nombreDoctora()}. ¿Coordinamos un turno? Responda este mensaje y se lo agendamos.`);
}

function ingresosMeses(n){
  const h = hoy(), r = [];
  for (let i = n - 1; i >= 0; i--){
    const m0 = sumarMeses(inicioMes(h), -i), m1 = finMes(m0);
    r.push({ l:MESES_C[aFecha(m0).getMonth()], v:suma(cobradoEntre(m0, m1 > h ? h : m1)), act:i === 0 });
  }
  return r;
}


/* ===== js/09-agenda.js ===== */
/* =====================================================================
   AGENDA · vistas Día, Semana, Mes y Año
   - Tocar un horario libre (día / semana) abre "Nuevo turno" con fecha y hora.
   - Tocar un día (mes / año) abre ese día; el botón "+" del día (mes) agenda directo.
   - Tocar el nombre de un mes (año) abre la vista mensual.
   ===================================================================== */
const agenda = { vista:'dia', fecha:null, animar:true };
const VISTAS = [['dia', 'Día'], ['semana', 'Semana'], ['mes', 'Mes'], ['anio', 'Año']];
const esCelular = () => window.innerWidth <= 700;

RENDER.agenda = function(){
  if (!agenda.fecha) agenda.fecha = hoy();
  encabezado('Agenda', 'Tocá un horario libre para agendar. Tocá un turno para ver sus opciones.',
    `<button class="btn btn-prim" onclick="formTurno({fecha:agenda.fecha < hoy() ? hoy() : agenda.fecha})">${ico('mas')} Nuevo turno</button>`);
  $('#vista').innerHTML = `
    <div class="ag-barra">
      <div class="segmento" role="tablist" aria-label="Vista de la agenda">${VISTAS.map(([v, t]) => `<button role="tab" aria-selected="${agenda.vista === v}" class="${agenda.vista === v ? 'on' : ''}" onclick="cambiarVista('${v}')">${t}</button>`).join('')}</div>
      <div class="ag-nav">
        <button class="icon-btn" onclick="moverAgenda(-1)" aria-label="Anterior">${ico('izq')}</button>
        <div class="ag-lbl" id="ag-lbl">${etiquetaAgenda()}</div>
        <button class="icon-btn" onclick="moverAgenda(1)" aria-label="Siguiente">${ico('der')}</button>
      </div>
      <button class="btn btn-linea btn-sm" onclick="agendaHoy()">Hoy</button>
    </div>
    <div class="ag-cuerpo ${agenda.animar ? 'entra' : ''}" id="ag-cuerpo">${({ dia:vistaDia, semana:vistaSemana, mes:vistaMes, anio:vistaAnio })[agenda.vista]()}</div>
    ${agenda.vista === 'anio' ? leyendaAnio() : leyendaEstados()}`;
  agenda.animar = false;
  if (agenda.vista === 'dia' || agenda.vista === 'semana'){
    moverLineaAhora();
    iniciarReloj(moverLineaAhora, 30000);
    const l = $('.ag-ahora');   // en la vista del día, se acerca la línea de "ahora"
    if (l && agenda.vista === 'dia' && !_scrollAgendaHecho){ _scrollAgendaHecho = true; setTimeout(() => window.scrollTo({ top:Math.max(0, l.getBoundingClientRect().top + window.scrollY - 260), behavior:'smooth' }), 150); }
  }
};
let _scrollAgendaHecho = false;
function cambiarVista(v){ agenda.vista = v; agenda.animar = true; refrescar(); }
function agendaHoy(){ agenda.fecha = hoy(); agenda.animar = true; _scrollAgendaHecho = false; refrescar(); }
function abrirDia(f){ agenda.fecha = f; agenda.vista = 'dia'; agenda.animar = true; if (seccionActual !== 'agenda') ir('agenda'); else refrescar(); window.scrollTo(0, 0); }
function abrirMes(f){ agenda.fecha = f; agenda.vista = 'mes'; agenda.animar = true; refrescar(); window.scrollTo(0, 0); }
function moverAgenda(n){
  const f = agenda.fecha;
  agenda.fecha = agenda.vista === 'dia' ? sumarDias(f, n) : agenda.vista === 'semana' ? sumarDias(f, 7 * n) : agenda.vista === 'mes' ? sumarMeses(f, n) : sumarMeses(f, 12 * n);
  agenda.animar = true; refrescar();
}
function etiquetaAgenda(){
  const f = agenda.fecha, d = aFecha(f);
  if (agenda.vista === 'dia') return (f === hoy() ? 'Hoy, ' + fLarga(f) : mayus(fLarga(f))) + (d.getFullYear() !== new Date().getFullYear() ? ' ' + d.getFullYear() : '');
  if (agenda.vista === 'semana'){ const a = inicioSemana(f), b = sumarDias(a, 6); return aFecha(a).getDate() + (a.slice(5, 7) !== b.slice(5, 7) ? ' ' + MESES_C[aFecha(a).getMonth()] : '') + ' – ' + aFecha(b).getDate() + ' ' + MESES_C[aFecha(b).getMonth()] + ' ' + aFecha(b).getFullYear(); }
  if (agenda.vista === 'mes') return mayus(fMes(f));
  return String(d.getFullYear());
}
function leyendaEstados(){
  return `<div class="ag-leyenda">${Object.values(ESTADOS_TURNO).map(e => `<span class="chip ${e.c}">${e.t}</span>`).join('')}<span class="muted">· Rayado: fuera del horario de atención</span></div>`;
}
function leyendaAnio(){
  return `<div class="ag-leyenda"><span><i class="oc-1"></i> Libre</span><span><i class="oc-2"></i> Media</span><span><i class="oc-3"></i> Completa</span><span><i class="oc-0" style="border:1px solid var(--borde)"></i> Sin turnos</span><span><i style="box-shadow:inset 0 0 0 1.5px var(--accion)"></i> Feriado</span><span class="muted">· Tocá un día para abrirlo, o el nombre del mes para verlo entero.</span></div>`;
}

/* ---------- Bloque de un turno (día y semana) ---------- */
function bloqueTurno(t, top, alto, deu, compacto){
  const p = paciente(t.pac), e = ESTADOS_TURNO[t.estado];
  const puedeAtender = turnoPendienteDeAtender(t) && t.fecha <= hoy();
  const al = alertasPaciente(p).length, debe = deu[p.id] || 0;
  return `<div class="ag-t ${e.c} ${alto < 44 ? 'corto' : ''}" style="top:${top}px;height:${alto - 3}px" onclick="event.stopPropagation();verTurno('${t.id}')" role="button" tabindex="0"
      onkeydown="if(event.key==='Enter')verTurno('${t.id}')" title="${t.hora} · ${esc(p.nombre)} · ${e.t}">
    <div style="min-width:0">
      <div class="ag-tn">${compacto ? '' : t.hora + ' · '}${esc(compacto ? primerNombre(p.nombre) + ' ' + p.nombre.split(' ')[1] : p.nombre)}</div>
      <div class="ag-ts">${compacto ? t.hora : TIPOS_TURNO[t.tipo].t + (t.nota ? ' · ' + esc(t.nota) : '')}</div>
    </div>
    ${compacto ? '' : `<div class="ag-ta">${al ? `<span class="chip alerta-chip" title="Tiene alertas en la ficha">${ico('alerta')}</span>` : ''}${debe ? chipDeuda(debe) : ''}${chipTurno(t.estado)}
      ${puedeAtender ? `<button class="btn btn-prim btn-xs" onclick="event.stopPropagation();atender('${t.id}', this.closest('.ag-t'))">${ico('estetoscopio')} Atender</button>` : ''}</div>`}
  </div>`;
}
// Carriles para turnos que se pisan (por ejemplo, uno cancelado y otro nuevo en el mismo horario)
function carriles(lista){
  const fin = [], r = new Map();
  lista.forEach(t => { const a = minutos(t.hora); let k = fin.findIndex(x => x <= a); if (k < 0){ k = fin.length; fin.push(0); } fin[k] = finTurno(t); r.set(t.id, k); });
  return { de: r, n: Math.max(1, fin.length) };
}
function rangoHoras(fechas){
  let a = 24 * 60, b = 0;
  fechas.forEach(f => {
    const h = horarioDelDia(f);
    if (h){ a = Math.min(a, minutos(h[0])); b = Math.max(b, minutos(h[1])); }
    turnosDelDia(f).forEach(t => { a = Math.min(a, minutos(t.hora)); b = Math.max(b, finTurno(t)); });
  });
  if (a >= b){ a = 9 * 60; b = 13 * 60; }
  return [Math.floor(a / 60) * 60, Math.ceil(b / 60) * 60];
}

/* ---------- Día ---------- */
const PX_DIA = 1.7, PASO = 20;
function vistaDia(){
  const f = agenda.fecha, hor = horarioDelDia(f), lista = turnosDelDia(f), deu = deudas();
  const [a, b] = rangoHoras([f]), alto = (b - a) * PX_DIA;
  const y = m => (m - a) * PX_DIA;
  let html = '';
  const fer = feriado(f);
  const avisos = [];
  if (!hor) avisos.push(`Los ${DIAS[diaSemana(f)]} no hay horario de atención. Igual podés agendar si hace falta.`);
  if (fer) avisos.push('Feriado: ' + fer + '.');
  // Zonas fuera del horario
  if (hor){
    if (minutos(hor[0]) > a) html += `<div class="ag-fuera" style="top:0;height:${y(minutos(hor[0]))}px"></div>`;
    if (minutos(hor[1]) < b) html += `<div class="ag-fuera" style="top:${y(minutos(hor[1]))}px;bottom:0"></div>`;
  } else html += `<div class="ag-fuera" style="top:0;bottom:0"></div>`;
  // Horarios libres (se tocan para agendar)
  const act = lista.filter(turnoActivo);
  const s0 = hor ? minutos(hor[0]) : a, s1 = hor ? minutos(hor[1]) : b;
  for (let m = s0; m + PASO <= s1; m += PASO){
    if (act.some(t => minutos(t.hora) < m + PASO && finTurno(t) > m)) continue;
    html += `<button class="ag-slot" style="top:${y(m)}px;height:${PASO * PX_DIA - 2}px" onclick="formTurno({fecha:'${f}',hora:'${hhmm(m)}'})" aria-label="Agendar a las ${hhmm(m)}">＋ ${hhmm(m)} · Agendar</button>`;
  }
  // Turnos
  const c = carriles(lista);
  html += lista.map(t => {
    const k = c.de.get(t.id), w = 100 / c.n;
    return bloqueTurno(t, y(minutos(t.hora)), t.dur * PX_DIA, deu).replace('style="top:', `style="left:calc(${k * w}% + 8px);right:calc(${100 - (k + 1) * w}% + 8px);top:`);
  }).join('');
  // Línea de "ahora"
  if (f === hoy()) html += `<div class="ag-ahora" data-a="${a}" data-b="${b}" data-px="${PX_DIA}"><span></span></div>`;
  let horas = '';
  for (let m = a; m <= b; m += 60) horas += `<div class="ag-h" style="top:${y(m)}px">${hhmm(m)}</div>`;
  const resumen = lista.filter(t => t.estado !== 'cancelado').length;
  return `<div class="ag-caja">
    ${avisos.map(x => `<div class="ag-aviso">${ico('info')} ${x}</div>`).join('')}
    <div class="ag-aviso">${ico('agenda')} ${resumen ? `<b>${resumen} turnos</b> · ${lista.filter(t => t.estado === 'atendido').length} atendidos · ${lista.filter(t => t.estado === 'espera').length} en sala de espera` : 'Día libre: tocá un horario para agendar.'}${hor ? ` <span class="muted">· Atención de ${hor[0]} a ${hor[1]}</span>` : ''}</div>
    <div class="ag-dia" style="padding:10px 0 14px"><div class="ag-horas" style="height:${alto}px">${horas}</div>
    <div class="ag-carril" style="height:${alto}px;background-size:100% ${60 * PX_DIA}px">${html}</div></div></div>`;
}
function moverLineaAhora(){
  const l = $('.ag-ahora'); if (!l) return;
  const a = Number(l.dataset.a), b = Number(l.dataset.b), px = Number(l.dataset.px), m = ahoraMin();
  if (m < a || m > b){ l.style.display = 'none'; return; }
  l.style.display = ''; l.style.top = (m - a) * px + 'px';
  $('span', l).textContent = 'Ahora ' + horaAhora();
}

/* ---------- Semana ---------- */
const PX_SEM = 1.15;
function vistaSemana(){
  const lunes = inicioSemana(agenda.fecha), dias = Array.from({ length:7 }, (_, i) => sumarDias(lunes, i)), deu = deudas(), h = hoy();
  if (esCelular()){
    return `<div class="ag-sem-lista">` + dias.map(f => {
      const l = turnosDelDia(f), hor = horarioDelDia(f), fer = feriado(f);
      return `<div class="ag-sl-dia ${f === h ? 'hoy' : ''}">
        <div class="ag-sl-cab"><button onclick="abrirDia('${f}')"><b>${f === h ? 'Hoy · ' + fLarga(f) : mayus(fLarga(f))}</b></button>
          <button class="btn btn-suave btn-xs" onclick="formTurno({fecha:'${f}'})">${ico('mas')} Agendar</button></div>
        ${fer ? `<div class="muted chico">Feriado: ${fer}</div>` : ''}
        ${l.length ? `<div class="lt">${l.map(t => filaTurnoHoy(t, deu)).join('')}</div>` : `<div class="muted chico" style="padding:6px 0">${hor ? 'Sin turnos' : 'No hay atención este día'}</div>`}
      </div>`;
    }).join('') + `</div>`;
  }
  const [a, b] = rangoHoras(dias), alto = (b - a) * PX_SEM, y = m => (m - a) * PX_SEM;
  let horas = '';
  for (let m = a; m <= b; m += 60) horas += `<div class="ag-h" style="top:${y(m)}px">${hhmm(m)}</div>`;
  const cab = dias.map(f => { const fer = feriado(f); return `<button class="ag-sem-cab ${f === h ? 'hoy' : ''} ${fer ? 'fer' : ''}" onclick="abrirDia('${f}')" title="${fer ? 'Feriado: ' + esc(fer) : 'Abrir el día'}">${DIAS_C[diaSemana(f)]}<b>${aFecha(f).getDate()}</b></button>`; }).join('');
  const cols = dias.map(f => {
    const hor = horarioDelDia(f), l = turnosDelDia(f), c = carriles(l);
    let z = '';
    if (hor){
      if (minutos(hor[0]) > a) z += `<div class="ag-fuera" style="top:0;height:${y(minutos(hor[0]))}px"></div>`;
      if (minutos(hor[1]) < b) z += `<div class="ag-fuera" style="top:${y(minutos(hor[1]))}px;bottom:0"></div>`;
    } else z += `<div class="ag-fuera" style="top:0;bottom:0"></div>`;
    z += l.map(t => { const k = c.de.get(t.id), w = 100 / c.n; return bloqueTurno(t, y(minutos(t.hora)), t.dur * PX_SEM, deu, true).replace('style="top:', `style="left:calc(${k * w}% + 3px);right:calc(${100 - (k + 1) * w}% + 3px);top:`); }).join('');
    if (f === h) z += `<div class="ag-ahora" data-a="${a}" data-b="${b}" data-px="${PX_SEM}"><span></span></div>`;
    return `<div class="ag-sem-col ${f === h ? 'hoy' : ''}" style="height:${alto}px;background-size:100% ${60 * PX_SEM}px" onclick="clicSemana(event,'${f}',${a})" title="Tocá para agendar">${z}</div>`;
  }).join('');
  return `<div class="ag-caja"><div class="ag-sem"><div class="ag-sem-cab"></div>${cab}
    <div class="ag-horas" style="height:${alto}px">${horas}</div>${cols}</div></div>`;
}
function clicSemana(e, f, a){
  const r = e.currentTarget.getBoundingClientRect();
  const m = a + Math.floor((e.clientY - r.top) / PX_SEM / PASO) * PASO;
  formTurno({ fecha:f, hora:hhmm(m) });
}

/* ---------- Mes ---------- */
function vistaMes(){
  const m0 = inicioMes(agenda.fecha), m1 = finMes(m0), h = hoy();
  const d0 = inicioSemana(m0), semanas = Math.ceil((difDias(d0, m1) + 1) / 7);
  let html = ['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'].map(x => `<div class="ag-mes-dn">${x}</div>`).join('');
  for (let i = 0; i < semanas * 7; i++){
    const f = sumarDias(d0, i), l = turnosDelDia(f).filter(t => t.estado !== 'cancelado'), fer = feriado(f), hor = horarioDelDia(f);
    const nombres = l.slice(0, 3).map(t => `<div class="nm" style="color:var(--${({ confirmado:'accion', espera:'pend', atendido:'ok', ausente:'mal' })[t.estado] || 'gris'})"><i></i><span style="color:var(--texto-2)">${t.hora} ${esc(primerNombre(paciente(t.pac).nombre))}</span></div>`).join('');
    html += `<div class="ag-md ${f === h ? 'hoy' : ''} ${f.slice(0, 7) !== m0.slice(0, 7) ? 'otro' : ''} ${!hor ? 'cerrado' : ''}" onclick="abrirDia('${f}')" role="button" tabindex="0" onkeydown="if(event.key==='Enter')abrirDia('${f}')"
        title="${fLarga(f)}${l.length ? ' · ' + l.length + ' turnos' : ''}${fer ? ' · Feriado: ' + esc(fer) : ''}">
      <span class="n">${aFecha(f).getDate()}</span>${l.length ? `<span class="cnt">${l.length}</span>` : ''}
      ${fer ? `<span class="fer">${esc(fer)}</span>` : ''}${nombres}${l.length > 3 ? `<span class="mas">+${l.length - 3} más</span>` : ''}
      <button class="ag-md-add" onclick="event.stopPropagation();formTurno({fecha:'${f}'})" aria-label="Agendar el ${fLarga(f)}" title="Agendar este día">${ico('mas')}</button>
    </div>`;
  }
  return `<div class="ag-caja"><div class="ag-mes">${html}</div></div>`;
}

/* ---------- Año ---------- */
function vistaAnio(){
  const y = aFecha(agenda.fecha).getFullYear(), h = hoy();
  const porDia = {};
  D().turnos.forEach(t => { if (t.fecha.startsWith(y + '-')) (porDia[t.fecha] = porDia[t.fecha] || []).push(t); });
  let html = '';
  for (let m = 0; m < 12; m++){
    const m0 = y + '-' + p2(m + 1) + '-01', m1 = finMes(m0);
    const blancos = (diaSemana(m0) + 6) % 7;
    let celdas = 'LMMJVSD'.split('').map(x => `<span class="dn">${x}</span>`).join('') + '<span class="d v"></span>'.repeat(blancos);
    let total = 0;
    for (let f = m0; f <= m1; f = sumarDias(f, 1)){
      const l = (porDia[f] || []).filter(t => t.estado !== 'cancelado'); total += l.length;
      const oc = ocupacionDia(f, l);
      const nivel = oc < 0 ? (l.length ? 1 : 'x') : (!l.length ? 0 : oc < .3 ? 1 : oc < .6 ? 2 : 3);
      const fer = feriado(f);
      celdas += `<button class="d oc-${nivel} ${f === h ? 'hoy' : ''} ${fer ? 'fer' : ''} ${f < h ? 'pas' : ''}" onclick="abrirDia('${f}')"
        title="${fLarga(f)} · ${l.length ? l.length + ' turnos (' + Math.round(Math.max(0, oc) * 100) + ' % ocupado)' : (oc < 0 ? 'sin atención' : 'libre')}${fer ? ' · Feriado: ' + esc(fer) : ''}">${aFecha(f).getDate()}</button>`;
    }
    html += `<div class="ag-mm ${m0.slice(0, 7) === h.slice(0, 7) ? 'actual' : ''}"><button class="ag-mm-t" onclick="abrirMes('${m0}')">${mayus(MESES[m])}<small>${total} turnos</small></button><div class="ag-mm-g">${celdas}</div></div>`;
  }
  return `<div class="ag-anio">${html}</div>`;
}

/* ---------- Selector de paciente (buscar por nombre o CI, o crear uno nuevo) ---------- */
function selectorPaciente(nombre, pid){
  const p = pid ? paciente(pid) : null;
  return `<div class="sel-pac" data-campo="${nombre}">
    <input type="hidden" name="${nombre}" value="${p ? p.id : ''}">
    <div class="buscar" style="max-width:none"><svg class="ico" viewBox="0 0 24 24">${ICONOS.buscar}</svg>
      <input type="text" class="sp-txt" placeholder="Escribí el nombre o la CI…" value="${p ? esc(p.nombre) : ''}" autocomplete="off"></div>
    <div class="sp-lista hidden"></div>
  </div>`;
}
function activarSelectores(raiz, alElegir){
  $$('.sel-pac', raiz).forEach(sp => {
    const txt = $('.sp-txt', sp), lista = $('.sp-lista', sp), oculto = $('input[type=hidden]', sp);
    const pintar = () => {
      const q = normalizar(txt.value.trim()), qd = soloDigitos(q);
      const res = pacientesOrden().filter(p => !q || normalizar(p.nombre).includes(q) || (qd.length >= 3 && soloDigitos(p.ci).includes(qd))).slice(0, 7);
      lista.innerHTML = res.map(p => `<button type="button" class="bus-item" data-id="${p.id}">${avatar(p)}<div style="min-width:0"><div class="persona-n">${esc(p.nombre)}</div><div class="persona-s">CI ${esc(p.ci)} · ${edad(p.nac)} años</div></div><span class="der">${chipAlertas(p)}</span></button>`).join('') +
        (txt.value.trim().length > 2 ? `<button type="button" class="bus-item" data-nuevo="1"><div class="avatar">${ico('mas')}</div><div><div class="persona-n">Crear paciente «${esc(txt.value.trim())}»</div><div class="persona-s">Después completás su ficha</div></div></button>` : '');
      lista.classList.toggle('hidden', !lista.innerHTML);
    };
    txt.addEventListener('focus', pintar);
    txt.addEventListener('input', () => { oculto.value = ''; pintar(); });
    txt.addEventListener('blur', () => setTimeout(() => lista.classList.add('hidden'), 180));
    lista.addEventListener('mousedown', e => e.preventDefault());
    lista.addEventListener('click', e => {
      const b = e.target.closest('.bus-item'); if (!b) return;
      let p;
      if (b.dataset.nuevo){ p = crearPacienteRapido(txt.value.trim()); avisar('Se creó la ficha de ' + esc(p.nombre), 'usuario'); }
      else p = paciente(b.dataset.id);
      oculto.value = p.id; txt.value = p.nombre; lista.classList.add('hidden');
      if (alElegir) alElegir(p);
    });
  });
}
function crearPacienteRapido(nombre){
  const p = { id:Store.id('p'), nombre, ci:'', nac:'', sexo:'X', tel:'', email:'', dir:'', cobertura:'particular', entidad:'', socio:'',
    emergencia:{ nombre:'', vinculo:'', tel:'' }, alertas:{ alergias:'', cronicas:'', riesgo:'' }, etiquetas:[], antecedentes:{}, notas:'', alta:hoy() };
  D().pacientes.push(p); guardar();
  return p;
}

/* ---------- Nuevo turno / editar ---------- */
function formTurno(o){
  o = o || {};
  const t = o.id ? turno(o.id) : null;
  const v = t ? Object.assign({}, t) : { pac:o.pac || '', fecha:o.fecha || hoy(), hora:o.hora || '', tipo:o.tipo || 'control', dur:TIPOS_TURNO[o.tipo || 'control'].dur, nota:'' };
  if (!v.hora) v.hora = primerHorarioLibre(v.fecha, v.dur) || '09:00';
  abrirModal({
    titulo: t ? 'Editar turno' : 'Nuevo turno',
    sub: t ? esc(nombrePac(t.pac)) : 'Se agenda como <b>confirmado</b>',
    cuerpo: `<form class="form" id="f-turno" onsubmit="event.preventDefault();guardarTurno('${t ? t.id : ''}')">
      ${campo('Paciente', selectorPaciente('pac', v.pac), { ancho:true })}
      ${campo('Servicio', opciones('tipo', Object.entries(TIPOS_TURNO).map(([k, x]) => [k, x.corto]), v.tipo), { ancho:true })}
      ${campo('Fecha', inp('fecha', v.fecha, 'date', 'required'))}
      ${campo('Hora', inp('hora', v.hora, 'time', 'required step="300"'))}
      ${campo('Duración', sel('dur', [10, 15, 20, 30, 40, 45, 60].map(m => [m, m + ' minutos']), v.dur))}
      ${t ? campo('Estado', sel('estado', Object.entries(ESTADOS_TURNO).map(([k, x]) => [k, x.t]), t.estado)) : '<div></div>'}
      ${campo('Nota (opcional)', inp('nota', v.nota, 'text', 'placeholder="Ej.: trae estudios, viene acompañado…"'), { ancho:true })}
      <div class="campo ancho"><div class="ayuda" id="t-aviso" style="font-size:13px"></div></div>
    </form>`,
    pie: `${t ? `<button class="btn btn-peligro izq" onclick="cancelarTurno('${t.id}')">${ico('cancelar')} Cancelar turno</button>` : ''}
      <button class="btn btn-linea" onclick="cerrarModal()">Volver</button>
      <button class="btn btn-prim" onclick="guardarTurno('${t ? t.id : ''}')">${ico('ok')} ${t ? 'Guardar cambios' : 'Agendar turno'}</button>`,
    alAbrir: caja => {
      const f = $('#f-turno', caja);
      activarSelectores(caja, () => avisoTurno(t));
      $$('[name=tipo]', f).forEach(r => r.addEventListener('change', () => { f.dur.value = TIPOS_TURNO[r.value].dur; avisoTurno(t); }));
      ['fecha', 'hora', 'dur'].forEach(n => f[n].addEventListener('change', () => avisoTurno(t)));
      avisoTurno(t);
    }
  });
}
function primerHorarioLibre(f, dur){
  const h = horarioDelDia(f); if (!h) return '';
  let m = minutos(h[0]);
  if (f === hoy()) m = Math.max(m, Math.ceil(ahoraMin() / PASO) * PASO);
  const act = turnosDelDia(f).filter(turnoActivo);
  for (; m + dur <= minutos(h[1]); m += PASO) if (!act.some(t => minutos(t.hora) < m + dur && finTurno(t) > m)) return hhmm(m);
  return '';
}
// Aviso en vivo: superposición, fuera de horario, feriado
function avisoTurno(t){
  const f = $('#f-turno'); if (!f) return;
  const x = { id:t ? t.id : '', fecha:f.fecha.value, hora:f.hora.value, dur:Number(f.dur.value) };
  const r = [];
  if (x.fecha && x.hora){
    const s = superposicion(x);
    if (s) r.push(`<span class="naranja fuerte">${ico('alerta')} Se superpone con ${esc(nombrePac(s.pac))} (${s.hora} a ${hhmm(finTurno(s))}).</span>`);
    const fh = fueraDeHorario(x.fecha, x.hora, x.dur);
    if (fh) r.push(`<span class="naranja fuerte">${ico('reloj')} ${fh}.</span>`);
    const fer = feriado(x.fecha); if (fer) r.push(`${ico('info')} Es feriado: ${fer}.`);
    if (!r.length) r.push(`<span class="verde fuerte">${ico('ok')} Horario libre: ${fLarga(x.fecha)} de ${x.hora} a ${hhmm(minutos(x.hora) + x.dur)}.</span>`);
  }
  const pid = f.pac.value; if (pid){ const debe = deudaDe(pid); if (debe) r.push(`<span class="naranja fuerte">Este paciente tiene ${pesos(debe)} pendientes de cobro.</span>`); }
  $('#t-aviso').innerHTML = r.join('<br>');
}
async function guardarTurno(id){
  const f = $('#f-turno'), v = leerForm(f);
  if (!v.pac){ avisar('Elegí un paciente (o escribí su nombre para crearlo)', 'alerta'); $('.sp-txt', f).focus(); return; }
  if (!v.fecha || !v.hora){ avisar('Completá la fecha y la hora', 'alerta'); return; }
  const x = { id, fecha:v.fecha, hora:v.hora, dur:Number(v.dur) };
  // No se permiten turnos superpuestos ni fuera de horario sin confirmación explícita
  const s = (!v.estado || turnoActivo({ estado:v.estado })) ? superposicion(x) : null;
  if (s && !await confirmar('Turno superpuesto', `A esa hora ya está agendado <b>${esc(nombrePac(s.pac))}</b> (${s.hora} a ${hhmm(finTurno(s))}). ¿Querés agendarlo igual?`, 'Agendar igual', false, 'Cambiar horario')) return;
  const fh = fueraDeHorario(x.fecha, x.hora, x.dur);
  if (fh && !await confirmar('Fuera del horario de atención', fh + '. ¿Querés agendarlo igual?', 'Agendar igual', false, 'Cambiar horario')) return;
  let t = id ? turno(id) : null;
  if (t) Object.assign(t, { pac:v.pac, fecha:v.fecha, hora:v.hora, dur:Number(v.dur), tipo:v.tipo, nota:v.nota, estado:v.estado || t.estado });
  else { t = { id:Store.id('t'), pac:v.pac, fecha:v.fecha, hora:v.hora, dur:Number(v.dur), tipo:v.tipo, nota:v.nota, estado:'confirmado' }; D().turnos.push(t); }
  guardar(); cerrarModal(); checkListo();
  avisar(`Turno ${id ? 'actualizado' : 'agendado'}: ${esc(primerNombre(nombrePac(t.pac)))}, ${fLarga(t.fecha)} a las ${t.hora}`, 'agenda');
  if (seccionActual === 'agenda'){ agenda.fecha = t.fecha; }
  refrescar();
}
async function cancelarTurno(id){
  const t = turno(id);
  if (!await confirmar('¿Cancelar el turno?', `${esc(nombrePac(t.pac))} · ${fLarga(t.fecha)} a las ${t.hora}. El horario queda libre.`, 'Cancelar turno', true)) return;
  cerrarModal(); cambiarEstado(id, 'cancelado');
}

/* ---------- Cambiar estado (con Deshacer) ---------- */
function cambiarEstado(id, nuevo){
  const t = turno(id), antes = t.estado;
  if (antes === nuevo) return;
  t.estado = nuevo; guardar();
  if (modalAbierto()) cerrarModal();
  refrescar();
  const e = ESTADOS_TURNO[nuevo];
  avisar(`${esc(primerNombre(nombrePac(t.pac)))}: ${e.t.toLowerCase()}`, e.ico, () => { t.estado = antes; guardar(); refrescar(); avisar('Listo, se deshizo el cambio', 'deshacer'); });
}

/* ---------- Detalle del turno ---------- */
function verTurno(id){
  const t = turno(id), p = paciente(t.pac), al = alertasPaciente(p), debe = deudaDe(p.id), u = consultasDe(p.id)[0];
  const pend = turnoPendienteDeAtender(t), esHoyOPasado = t.fecha <= hoy();
  const b = (fn, i, txt, cls) => `<button class="btn ${cls || 'btn-linea'} btn-sm" onclick="${fn}">${ico(i)} ${txt}</button>`;
  let acciones = '';
  if (pend){
    if (esHoyOPasado) acciones += b(`cerrarModal();atender('${t.id}')`, 'estetoscopio', 'Atender', 'btn-prim');
    if (t.estado === 'confirmado' && t.fecha === hoy()) acciones += b(`cambiarEstado('${t.id}','espera')`, 'sala', 'Llegó: pasa a sala de espera');
    if (t.estado === 'espera') acciones += b(`cambiarEstado('${t.id}','confirmado')`, 'deshacer', 'Sacar de sala de espera');
    acciones += b(`recordatorioTurno('${t.id}')`, 'wa', 'Recordatorio por WhatsApp', 'btn-wa');
    if (esHoyOPasado) acciones += b(`cambiarEstado('${t.id}','ausente')`, 'ausente', 'No vino (ausente)');
    acciones += b(`cerrarModal();formTurno({id:'${t.id}'})`, 'editar', 'Reprogramar / editar');
    acciones += b(`cancelarTurno('${t.id}')`, 'cancelar', 'Cancelar turno', 'btn-peligro');
  } else if (t.estado === 'atendido'){
    if (t.consulta) acciones += b(`verConsulta('${t.consulta}')`, 'nota', 'Ver la consulta', 'btn-prim');
  } else {
    acciones += b(`cambiarEstado('${t.id}','confirmado')`, 'deshacer', 'Volver a confirmado');
    acciones += b(`cerrarModal();formTurno({pac:'${p.id}',tipo:'${t.tipo}'})`, 'agenda', 'Dar otro turno', 'btn-prim');
  }
  abrirModal({
    titulo: esc(p.nombre),
    sub: `${fLargaAnio(t.fecha)} · ${t.hora} a ${hhmm(finTurno(t))}`,
    cuerpo: `
      ${al.length ? `<div class="alertas-banda" style="position:static">${ico('alerta')}<span class="ab-t">Alertas</span>${al.map(a => `<span class="ab">${esc(a)}</span>`).join('')}</div>` : ''}
      ${debe ? `<div class="deuda-banda">${ico('honorarios')} Tiene ${pesos(debe)} pendientes de cobro<button class="btn btn-suave btn-xs" onclick="cerrarModal();registrarPago('${p.id}')">Registrar pago</button></div>` : ''}
      <div class="fila" style="margin-bottom:12px">${chipTurno(t.estado)}<span class="tag">${TIPOS_TURNO[t.tipo].t}</span><span class="tag">${t.dur} min</span>${tagsCronico(p)}</div>
      <div class="antec">
        ${t.nota ? `<div class="an-item"><div class="an-l">Nota del turno</div><div class="an-v">${esc(t.nota)}</div></div>` : ''}
        <div class="an-item"><div class="an-l">Paciente</div><div class="an-v">${p.nac ? edad(p.nac) + ' años · ' : ''}${p.ci ? 'CI ' + esc(p.ci) + ' · ' : ''}${esc(textoCobertura(p))}${p.tel ? ' · ' + esc(p.tel) : ''}</div></div>
        <div class="an-item"><div class="an-l">Última consulta</div><div class="an-v">${u ? fCorta(u.fecha) + ' · ' + esc(dxTexto(u.dx) || u.motivo) : 'Es su primera consulta'}</div></div>
      </div>
      <div class="fila mt">${acciones}</div>`,
    pie: `<button class="btn btn-linea izq" onclick="cerrarModal();abrirFicha('${p.id}')">${ico('usuario')} Ver ficha del paciente</button><button class="btn btn-linea" onclick="cerrarModal()">Cerrar</button>`
  });
}

/* ---------- Atender: el turno se expande y se transforma en el formulario de consulta ---------- */
function atender(id, el){
  const t = turno(id);
  if (!t) return;
  if (t.estado === 'atendido' && t.consulta){ verConsulta(t.consulta); return; }
  if (!el || sinMovimiento()){ abrirConsulta({ turno:id }); return; }
  const r = el.getBoundingClientRect();
  const x = document.createElement('div');
  x.className = 'expansion';
  Object.assign(x.style, { left:r.left + 'px', top:r.top + 'px', width:r.width + 'px', height:r.height + 'px' });
  document.body.appendChild(x);
  const cel = window.innerWidth <= 700;
  const w = cel ? window.innerWidth : Math.min(900, window.innerWidth - 32);
  requestAnimationFrame(() => requestAnimationFrame(() => Object.assign(x.style, {
    left:(window.innerWidth - w) / 2 + 'px', top:(cel ? window.innerHeight * .06 : 36) + 'px', width:w + 'px',
    height:(cel ? window.innerHeight * .94 : Math.min(window.innerHeight - 72, 720)) + 'px', borderRadius:'18px' })));
  setTimeout(() => { abrirConsulta({ turno:id }); setTimeout(() => x.remove(), 120); }, 430);
}

/* ---------- WhatsApp ---------- */
function recordatorioTurno(id){
  const t = turno(id), p = paciente(t.pac);
  enviarWhatsApp(p, textoMensaje(cfg().mensajeWA, { nombre:primerNombre(p.nombre), doctora:nombreDoctora(), centro:nombreCentro(), dia:(t.fecha === hoy() ? 'hoy ' : '') + fLarga(t.fecha), hora:t.hora }));
}
async function enviarWhatsApp(p, texto){
  if (!p.tel){ avisar('Este paciente no tiene teléfono cargado', 'alerta'); return; }
  if (MODO_DEMO){
    const ok = await confirmar('Recordatorio por WhatsApp',
      `Se envía a <b>+${telLimpio(p.tel)}</b> con este mensaje:<br><br><i>«${esc(texto)}»</i><br><br><span class="muted chico">Demostración: los teléfonos son inventados, así que WhatsApp se abre con el mensaje escrito pero sin destinatario.</span>`, 'Abrir WhatsApp');

const pacFiltro = { q:'', cob:'', et:'', max:40 };

function filtrarPacientes(){
  const q = normalizar(pacFiltro.q.trim()), qd = soloDigitos(q), deu = deudas();
  return pacientesOrden().filter(p => {
    if (q && !normalizar(p.nombre).includes(q) && !(qd.length >= 3 && soloDigitos(p.ci).includes(qd))) return false;
    if (pacFiltro.cob && p.cobertura !== pacFiltro.cob) return false;
    if (pacFiltro.et === 'cronicos' && !p.etiquetas.length) return false;
    if (pacFiltro.et === 'alertas' && !alertasPaciente(p).length) return false;
    if (pacFiltro.et === 'deuda' && !deu[p.id]) return false;
    if (ETIQUETAS[pacFiltro.et] && !p.etiquetas.includes(pacFiltro.et)) return false;
    return true;
  });
}
function infoControl(p){
  const u = consultasDe(p.id)[0];
  const prox = D().turnos.filter(t => t.pac === p.id && t.fecha >= hoy() && turnoPendienteDeAtender(t)).sort(ordenTurno)[0];
  return { u, prox, venc: u && u.proximo && u.proximo < hoy() && !prox };
}

  const seguimiento = pacFiltro.et && pacFiltro.et !== 'alertas' && pacFiltro.et !== 'deuda';

      <td data-l="Última consulta">${c.u ? fCorta(c.u.fecha) + `<div class="muted chico">${esc(dxTexto(c.u.dx))}</div>` : '<span class="muted">Sin consultas</span>'}</td>
      <td data-l="Próximo control">${c.prox ? `<span class="chip e-conf">Turno ${fMedia(c.prox.fecha)}</span>` : c.venc ? `<span class="chip e-mal">Vencido ${cuando(c.u.proximo)}</span>` : (c.u && c.u.proximo ? fMedia(c.u.proximo) : '<span class="muted">—</span>')}</td>
      <td data-l="Avisos"><div class="fila" style="justify-content:flex-end">${chipAlertas(p)}${chipDeuda(deu[p.id] || 0)}</div></td>
    </tr>`;
  }).join('');
  $('#vista').innerHTML = `
    <div class="herr">
      <div class="buscar">${ico('buscar')}<input type="search" placeholder="Buscar por nombre o CI…" value="${esc(pacFiltro.q)}" oninput="pacFiltro.q=this.value;pacFiltro.max=40;redibujarPacientes()" id="pac-q"></div>
      <select class="sel" onchange="pacFiltro.cob=this.value;refrescar()" aria-label="Cobertura">${[['', 'Todas las coberturas'], ...Object.entries(COBERTURAS)].map(([k, t]) => `<option value="${k}" ${pacFiltro.cob === k ? 'selected' : ''}>${t}</option>`).join('')}</select>
    </div>
    <div class="pildoras" style="margin-bottom:14px">${pild.map(([k, t, n]) => `<button class="pildora ${pacFiltro.et === k ? 'on' : ''}" onclick="pacFiltro.et='${k}';pacFiltro.max=40;refrescar()">${t} <span class="n">${n}</span></button>`).join('')}</div>
    ${seguimiento ? `<div class="card revelar" style="margin-bottom:14px;padding:14px 18px"><div class="fila-fin"><div class="fila">${ico('bandera')}<b>Lista de seguimiento:</b> ${lista.length} pacientes · <span class="rojo fuerte">${lista.filter(p => infoControl(p).venc).length} con el control vencido</span></div>

    <div class="tabla-caja revelar" id="pac-tabla">${lista.length ? `<table class="tabla resp"><thead><tr><th>Paciente</th><th>Cobertura</th><th>Seguimiento</th><th>Última consulta</th><th>Próximo control</th><th class="derecha">Avisos</th></tr></thead><tbody>${filas}</tbody></table>

async function guardarPaciente(id){
  const v = leerForm($('#f-pac'));
  if (!v.nombre){ avisar('Escribí el nombre del paciente', 'alerta'); $('#f-pac').nombre.focus(); return; }
  const dup = v.ci && D().pacientes.find(x => x.id !== id && soloDigitos(x.ci) === soloDigitos(v.ci));
  if (dup && !await confirmar('CI repetida', `Ya existe <b>${esc(dup.nombre)}</b> con esa cédula. ¿Guardar igual?`, 'Guardar igual')) return;
  const datos = { nombre:v.nombre, ci:v.ci, nac:v.nac, sexo:v.sexo, tel:v.tel, email:v.email, dir:v.dir, cobertura:v.cobertura || 'particular', entidad:v.entidad, socio:v.socio,
    emergencia:{ nombre:v.em_nombre, vinculo:v.em_vinculo, tel:v.em_tel }, alertas:{ alergias:v.al_alergias, cronicas:v.al_cronicas, riesgo:v.al_riesgo }, etiquetas:v.etiquetas || [] };
  let p = id ? paciente(id) : null;
  if (p) Object.assign(p, datos);
  else { p = Object.assign({ id:Store.id('p'), antecedentes:{}, notas:'', alta:hoy() }, datos); D().pacientes.push(p); }
  guardar(); cerrarModal(); checkListo();
  avisar(id ? 'Datos actualizados' : 'Paciente creado: ' + esc(p.nombre), 'usuario');
  if (id) refrescar(); else abrirFicha(p.id);
}

}

/* ---------- Evolución: gráficos de dolor, presión, peso y glucemia ---------- */
function fichaEvolucion(p, x){
  const cons = x.cons.slice().reverse().filter(c => c.sv);
  const pts = k => cons.filter(c => c.sv[k] !== '' && c.sv[k] != null && (k === 'eva' || c.sv[k])).map(c => ({ f:c.fecha, v:Number(c.sv[k]) }));
  const G = {
    dolor:{ t:'Dolor (EVA)', html:() => graficoLineas([{ n:'Dolor', pts:pts('eva') }], { unidad:'/10', banda:[0, 3], piso:0, techo:10, titulo:'Evolución del dolor' }) +
      `<div class="leyenda"><span><i></i>Dolor según escala EVA (0 = sin dolor, 10 = máximo)</span><span><i class="bn"></i>Dolor leve (0 a 3)</span></div>` },
    presion:{ t:'Presión arterial', html:() => graficoLineas([{ n:'Sistólica', pts:pts('sis') }, { n:'Diastólica', cls:'l2', pts:pts('dia') }], { unidad:'mmHg', banda:[70, 130], titulo:'Presión arterial' }) +
      `<div class="leyenda"><span><i></i>Sistólica</span><span><i class="l2"></i>Diastólica</span><span><i class="bn"></i>Rango deseable (hasta 130/85)</span></div>` },
    peso:{ t:'Peso', html:() => graficoLineas([{ n:'Peso', pts:pts('peso') }], { unidad:'kg', titulo:'Peso' }) + `<div class="leyenda"><span><i></i>Peso (kg)</span>${pts('imc').length ? `<span>IMC actual: <b>${String(pts('imc').slice(-1)[0].v).replace('.', ',')}</b></span>` : ''}</div>` },
    glucemia:{ t:'Glucemia', html:() => graficoLineas([{ n:'Glucemia', pts:pts('gluc') }], { unidad:'mg/dL', banda:[70, 99], titulo:'Glucemia' }) + `<div class="leyenda"><span><i></i>Glucemia en ayunas (mg/dL)</span><span><i class="bn"></i>Rango normal (70 a 99)</span></div>` }
  };
  const ult = cons[cons.length - 1];
  return `<div class="grid g-21">
    <div class="card revelar">
      <div class="card-cab"><div class="card-t">${ico('grafico')} ${G[fichaGrafico].t}</div>
        <div class="segmento">${Object.entries(G).map(([k, g]) => `<button class="${fichaGrafico === k ? 'on' : ''}" onclick="fichaGrafico='${k}';refrescar()">${g.t.split(' ')[0]}</button>`).join('')}</div></div>
      ${G[fichaGrafico].html()}
    </div>
    <div class="card revelar">
      <div class="card-t" style="margin-bottom:12px">${ico('pulso')} Últimos signos vitales</div>
      ${ult ? `<div class="muted chico">${fLargaAnio(ult.fecha)}</div>${svChips(ult.sv)}
        <div class="t2 chico mt">El color indica el rango: <span class="verde fuerte">verde</span> normal, <span class="naranja fuerte">naranja</span> vigilar y <span class="rojo fuerte">rojo</span> fuera de rango.</div>` : vacio('historia', 'Sin registros', 'Los signos vitales se cargan en cada consulta.')}
    </div>
  </div>`;
}

/* ---------- Documentos del paciente ---------- */
function fichaDocumentos(p, x){
  const docs = x.docs.slice().sort((a, b) => b.fecha.localeCompare(a.fecha));
  return `<div class="fila" style="margin-bottom:12px">
      <button class="btn btn-linea btn-sm" onclick="formReceta({pac:'${p.id}'})">${ico('receta')} Emitir receta</button>
      ${ultimaReceta(p.id) ? `<button class="btn btn-suave btn-sm" onclick="repetirReceta('${p.id}')">${ico('repetir')} Repetir receta anterior</button>` : ''}
      <button class="btn btn-linea btn-sm" onclick="formCertificado({pac:'${p.id}'})">${ico('certificado')} Emitir certificado</button>
      <button class="btn btn-linea btn-sm" onclick="formOrden({pac:'${p.id}'})">${ico('orden')} Emitir orden</button></div>
    <div class="tabla-caja">${docs.length ? tablaDocumentos(docs, false) : vacio('documentos', 'Todavía no hay documentos', 'Recetas, certificados y órdenes quedan guardados acá.')}</div>`;
}

/* ---------- Turnos y pagos del paciente ---------- */
function fichaTurnos(p, x){
  const hons = x.hons.slice().sort((a, b) => b.fecha.localeCompare(a.fecha));
  const aus = x.turnos.filter(t => t.estado === 'ausente').length, pasados = x.turnos.filter(t => t.fecha < hoy() && t.estado !== 'cancelado').length;
  return `<div class="grid g-2">
    <div class="card revelar"><div class="card-cab"><div class="card-t">${ico('agenda')} Turnos <span class="card-num">${x.turnos.length}</span></div>
      <button class="btn btn-prim btn-xs" onclick="formTurno({pac:'${p.id}'})">${ico('mas')} Nuevo turno</button></div>
      ${pasados ? `<div class="muted chico" style="margin-bottom:6px">Faltó a ${aus} de ${pasados} turnos (${pct(aus / pasados * 100)})</div>` : ''}
      ${x.turnos.length ? `<div class="lt">${x.turnos.slice(0, 25).map(t => `<div class="lt-item" style="grid-template-columns:92px minmax(0,1fr) auto">
        <div class="lt-hora" style="font-size:13.5px">${fCorta(t.fecha)}<small>${t.hora}</small></div><div class="t2">${TIPOS_TURNO[t.tipo].t}${t.nota ? ' · ' + esc(t.nota) : ''}</div>
        <div class="lt-acc"><button onclick="verTurno('${t.id}')">${chipTurno(t.estado)}</button></div></div>`).join('')}</div>` : vacio('agenda', 'Sin turnos')}
    </div>
    <div class="card revelar"><div class="card-cab"><div class="card-t">${ico('honorarios')} Honorarios</div>
      <button class="btn btn-linea btn-xs" onclick="registrarPago('${p.id}')">${ico('honorarios')} Registrar pago</button></div>
      <div class="fila" style="margin-bottom:8px"><span class="chip e-ok">Cobrado ${pesos(suma(hons.filter(h => h.estado === 'cobrado')))}</span>${deudaDe(p.id) ? `<span class="chip e-pend">Pendiente ${pesos(deudaDe(p.id))}</span>` : ''}</div>
      ${hons.length ? `<div class="lt">${hons.slice(0, 25).map(h => `<div class="lt-item" style="grid-template-columns:92px minmax(0,1fr) auto">
        <div class="lt-hora" style="font-size:13.5px">${fCorta(h.fecha)}</div><div class="t2">${esc(h.concepto)}${h.medio ? ' · ' + h.medio : ''}</div>
        <div class="lt-acc"><b class="num">${pesos(h.monto)}</b>${chipHon(h.estado)}</div></div>`).join('')}</div>` : vacio('dinero', 'Sin honorarios')}
    </div></div>`;
}
function fichaDatos(p){
  const it = (l, v) => `<div class="an-item"><div class="an-l">${l}</div><div class="an-v">${v ? esc(v) : '<span class="muted">—</span>'}</div></div>`;
  return `<div class="grid g-3">

      ${it('Nombre', p.nombre)}${it('CI', p.ci)}${it('Nacimiento', p.nac ? fCorta(p.nac) + ' (' + edad(p.nac) + ' años)' : '')}${it('Sexo', SEXOS[p.sexo])}${it('Paciente desde', fCorta(p.alta))}</div></div>
    <div class="card revelar"><div class="card-t" style="margin-bottom:12px">${ico('tel')} Contacto</div><div class="antec">
      ${it('Teléfono', p.tel)}${it('Email', p.email)}${it('Dirección', p.dir)}${it('Contacto de emergencia', p.emergencia && p.emergencia.nombre ? p.emergencia.nombre + ' · ' + p.emergencia.vinculo + ' · ' + p.emergencia.tel : '')}</div></div>
    <div class="card revelar"><div class="card-t" style="margin-bottom:12px">${ico('escudo')} Cobertura</div><div class="antec">
      ${it('Tipo', COBERTURAS[p.cobertura])}${it('Institución', p.entidad)}${it('Número de socio', p.socio)}</div>
      <button class="btn btn-linea btn-sm mt" onclick="formPaciente('${p.id}')">${ico('editar')} Editar datos</button></div>
  </div>`;

/* ---------- Impresión de la historia clínica ---------- */
function bloqueConsultaImpresa(c){
  const sv = c.sv || {}, s = [];
  if (sv.eva !== '' && sv.eva != null) s.push('Dolor (EVA) ' + sv.eva + '/10'); if (sv.sis) s.push('PA ' + sv.sis + '/' + sv.dia + ' mmHg'); if (sv.fc) s.push('FC ' + sv.fc + ' lpm'); if (sv.temp) s.push(String(sv.temp).replace('.', ',') + ' °C');
  if (sv.sat) s.push('SatO₂ ' + sv.sat + ' %'); if (sv.gluc) s.push('Glucemia ' + sv.gluc + ' mg/dL'); if (sv.peso) s.push('Peso ' + String(sv.peso).replace('.', ',') + ' kg'); if (sv.imc) s.push('IMC ' + String(sv.imc).replace('.', ','));
  return `<div class="ev"><div class="ev-c"><span>${fCorta(c.fecha)} · ${c.hora}</span><span>${TIPOS_TURNO[c.tipo] ? TIPOS_TURNO[c.tipo].t : ''}${c.sesion && c.sesion.total > 1 ? ' · sesión ' + c.sesion.n + ' de ' + c.sesion.total : ''}</span></div>
    <div><b>Motivo:</b> ${esc(c.motivo)}</div>${s.length ? `<div><b>Signos vitales:</b> ${s.join(' · ')}</div>` : ''}
    ${c.examen ? `<div><b>Examen físico:</b> ${esc(c.examen)}</div>` : ''}${c.dx && (c.dx.cod || c.dx.txt) ? `<div><b>Diagnóstico:</b> ${c.dx.cod ? esc(c.dx.cod) + ' · ' : ''}${esc(dxTexto(c.dx))}</div>` : ''}
    ${c.indic ? `<div><b>Indicaciones:</b> ${esc(c.indic).replace(/\n/g, '<br>')}</div>` : ''}${c.proximo ? `<div><b>Próximo control:</b> ${fCorta(c.proximo)}</div>` : ''}
    ${(c.correcciones || []).map(r => `<div style="margin-top:4px;padding-left:8px;border-left:2px solid #1F63D6"><b>Nota de corrección (${fCorta(r.fecha)} ${r.hora}):</b> ${esc(r.texto)}</div>`).join('')}</div>`;
}
function imprimirHistoria(pid){
  const p = paciente(pid), a = p.antecedentes || {}, al = alertasPaciente(p);
  imprimir(membrete() + `<div class="doc-t">Historia clínica</div>${datosPacienteDoc(p)}
    ${al.length ? `<div class="alertas-doc">ALERTAS: ${al.map(esc).join(' · ')}</div>` : ''}
    <h4>Antecedentes</h4>
    <table><tbody>
      <tr><td style="width:28%"><b>Personales</b></td><td>${esc(a.personales || '—')}</td></tr>
      <tr><td><b>Familiares</b></td><td>${esc(a.familiares || '—')}</td></tr>
      <tr><td><b>Quirúrgicos</b></td><td>${esc(a.quirurgicos || '—')}</td></tr>
      <tr><td><b>Alergias</b></td><td>${esc(p.alertas.alergias || 'No refiere')}</td></tr>
      <tr><td><b>Medicación habitual</b></td><td>${esc(a.medicacion || '—')}</td></tr>
      <tr><td><b>Hábitos</b></td><td>Tabaco: ${esc(a.tabaco || '—')} · Alcohol: ${esc(a.alcohol || '—')} · Actividad física: ${esc(a.actividad || '—')}</td></tr>
    </tbody></table>
    <h4>Evoluciones (${consultasDe(pid).length})</h4>
    ${consultasDe(pid).map(bloqueConsultaImpresa).join('') || '<p>Sin consultas registradas.</p>'}
    <div class="legal">Documento confidencial. Historia clínica según la Ley 18.335; datos personales protegidos por la Ley 18.331. Emitido el ${fCorta(hoy())} a las ${horaAhora()}.</div>` + firmaDoc() + pieDoc());
}
function imprimirConsulta(id){
  const c = consulta(id), p = paciente(c.pac);
  imprimir(membrete() + `<div class="doc-t">Consulta médica</div>${datosPacienteDoc(p)}${bloqueConsultaImpresa(c)}` + firmaDoc() + pieDoc());
}


/* ===== js/13-consulta.js ===== */
/* =====================================================================
   CONSULTA (evolución de la historia clínica)
   Flujo en un clic: desde el turno, "Atender" abre la consulta; al
   guardarla, el turno pasa a "atendido" y el honorario se genera solo
   con el arancel del tipo de consulta (cobrado o pendiente).
   ===================================================================== */
const PROXIMOS = [['', 'Sin control'], [7, '7 días'], [15, '15 días'], [30, '1 mes'], [90, '3 meses'], [180, '6 meses'], [365, '1 año']];

function abrirConsulta(o){
  o = o || {};
  const t = o.turno ? turno(o.turno) : null;
  const pid = t ? t.pac : o.pac;
  const p = pid ? paciente(pid) : null;
  const ult = p ? consultasDe(p.id)[0] : null;
  const tipo = t ? t.tipo : (ult ? 'control' : 'primera');
  const al = p ? alertasPaciente(p) : [], debe = p ? deudaDe(p.id) : 0;
  const cie = CIE10.map(([c, x]) => `<option value="${c} · ${esc(x)}">`).join('');
  const svc = (n, l, u, extra) => `<div class="campo sv-campo"><label>${l}<span class="sem-txt" id="sem-${n}"></span></label>${inp(n, '', 'number', 'step="any" inputmode="decimal" ' + (extra || ''))}<span class="unidad">${u}</span></div>`;
  abrirModal({
    titulo: 'Consulta' + (p ? ' · ' + esc(p.nombre) : ''),
    sub: `${fLargaAnio(hoy())} · ${horaAhora()}${t ? ' · Turno de las ' + t.hora : ''}`,
    ancho: 'ancho',
    cuerpo: `<form class="form f4 svf" id="f-cons" onsubmit="event.preventDefault()">
      ${p ? `<div class="pac-mini ancho" style="grid-column:1/-1">${avatar(p)}<div><div class="persona-n">${esc(p.nombre)}</div><div class="persona-s">${p.nac ? edad(p.nac) + ' años · ' : ''}${esc(textoCobertura(p))}${ult ? ' · Última consulta ' + cuando(ult.fecha) : ' · Primera consulta'}</div></div>
          <div class="chips">${tagsCronico(p)}${chipDeuda(debe)}</div></div>
        ${al.length ? `<div class="alertas-banda" style="position:static;grid-column:1/-1;margin:0">${ico('alerta')}<span class="ab-t">Alertas</span>${al.map(a => `<span class="ab">${esc(a)}</span>`).join('')}</div>` : ''}`
      : campo('Paciente', selectorPaciente('pac', ''), { ancho:true })}
      <input type="hidden" name="pac" value="${p ? p.id : ''}" ${p ? '' : 'disabled'}>

      <div class="bloque-t">${ico('nota')} Plantillas rápidas <span class="muted chico" style="font-family:var(--f-cuerpo);font-weight:600">· precargan los campos típicos; después se ajusta lo que haga falta</span></div>
      <div class="campo ancho"><div class="plantillas">${Object.entries(PLANTILLAS).map(([k, x]) => `<button type="button" class="plantilla" data-pl="${k}" onclick="aplicarPlantilla('${k}')">${ico(x.ico)} ${x.t}</button>`).join('')}</div></div>
      ${t ? `<input type="hidden" name="tipo" value="${t.tipo}"><div class="campo ancho"><label>Servicio</label><div class="fila"><span class="tag">${ico(TIPOS_TURNO[t.tipo].ico)} ${TIPOS_TURNO[t.tipo].t}</span></div></div>` : campo('Servicio', opciones('tipo', Object.entries(TIPOS_TURNO).map(([k, x]) => [k, x.corto]), tipo), { ancho:true })}
      <div class="campo ancho" id="ses-caja"><label>Sesión del tratamiento</label><div class="fila">Sesión ${inp('ses_n', '', 'number', 'min="1" style="width:78px"')} de ${inp('ses_t', '', 'number', 'min="1" style="width:78px"')} <span class="muted chico">· se sugiere sola a partir de la sesión anterior</span></div></div>
      ${campo('Motivo de consulta', area('motivo', t && t.nota ? t.nota : '', 'required placeholder="¿Por qué consulta hoy?" rows="2"'), { ancho:true })}

      <div class="bloque-t">${ico('pulso')} Dolor y signos vitales <span class="muted chico" style="font-family:var(--f-cuerpo);font-weight:600">· el IMC se calcula solo y cada valor muestra su semáforo</span></div>
      ${svc('eva', 'Dolor (escala EVA)', '/10', 'min="0" max="10" step="1" placeholder="0 a 10"')}
      ${svc('sis', 'Presión sistólica', 'mmHg', 'placeholder="120"')}
      ${svc('dia', 'Presión diastólica', 'mmHg', 'placeholder="80"')}
      ${svc('fc', 'Frec. cardíaca', 'lpm', 'placeholder="72"')}
      ${svc('sat', 'Saturación O₂', '%', 'placeholder="98"')}
      ${svc('gluc', 'Glucemia (ayunas)', 'mg/dL', 'placeholder="90"')}
      ${svc('peso', 'Peso', 'kg', `placeholder="${ult && ult.sv && ult.sv.peso ? String(ult.sv.peso).replace('.', ',') : '70'}"`)}
      ${svc('talla', 'Talla', 'cm', `value="${ult && ult.sv && ult.sv.talla ? ult.sv.talla : ''}" placeholder="170"`).replace('value="" ', '')}
      <div class="campo"><label>IMC <span class="sem-txt" id="sem-imc"></span></label><div class="imc-caja"><b id="imc-v">—</b><span class="muted chico" id="imc-t">Cargá peso y talla</span></div></div>

      <div class="bloque-t">${ico('estetoscopio')} Examen y diagnóstico</div>
      ${campo('Examen físico', area('examen', '', 'rows="2"'), { ancho:true })}
      ${campo('Diagnóstico CIE-10 (lista rápida)', `<input name="dx_busca" list="cie-lista" placeholder="Escribí código o nombre: «M54.5», «rodilla»…" autocomplete="off"><datalist id="cie-lista">${cie}</datalist>`, { cls:'', ayuda:'Los diagnósticos más frecuentes en el abordaje del dolor' })}
      ${campo('Código', inp('dx_cod', '', 'text', 'placeholder="Ej.: J06.9"'))}
      ${campo('Diagnóstico (texto libre)', inp('dx_txt', '', 'text', 'placeholder="Se completa solo o escribilo"'), { cls:'', ayuda:'' }).replace('class="campo', 'style="grid-column:span 2" class="campo')}
      ${campo('Indicaciones', area('indic', '', 'rows="3"'), { ancho:true })}
      <div class="campo ancho"><label>Próximo control</label><div class="opciones" id="prox-op">${PROXIMOS.map(([d, l]) => `<label class="opcion"><input type="radio" name="prox_op" value="${d}" ${d === '' ? 'checked' : ''}><span>${l}</span></label>`).join('')}
        <input type="date" name="proximo" style="max-width:170px;padding:8px 10px;border-radius:10px;border:1px solid var(--borde);background:var(--sup)"></div></div>

      <div class="bloque-t">${ico('honorarios')} Honorario <span class="muted chico" style="font-family:var(--f-cuerpo);font-weight:600">· se genera solo al guardar, con el arancel del tipo de consulta</span></div>
      <div class="hon-caja">

// Sesión sugerida: la siguiente a la última del mismo servicio (si el tratamiento sigue en curso)
function sugerirSesion(pid, tipo){
  const caja = $('#ses-caja'), f = $('#f-cons'); if (!caja) return;
  const conSes = !!TIPOS_TURNO[tipo].sesiones;
  caja.style.display = conSes ? '' : 'none';

}
function aplicarPlantilla(k){

function guardarConsulta(tid){
  const f = $('#f-cons'), v = leerForm(f);

  const sv = { eva:num(v.eva), sis:num(v.sis), dia:num(v.dia), fc:num(v.fc), temp:'', sat:num(v.sat), gluc:num(v.gluc), peso:num(v.peso), talla:num(v.talla) };

  D().consultas.push(c);

  const h = nuevoHonorario({ fecha, pac:pid, concepto:TIPOS_TURNO[tipo].t + (c.sesion && c.sesion.total > 1 ? ` · sesión ${c.sesion.n}/${c.sesion.total}` : ''), monto:v.monto, estado:v.h_estado || 'cobrado', medio:v.h_estado === 'cobrado' ? v.h_medio : '', consulta:c.id, fechaCobro:v.h_estado === 'cobrado' ? hoy() : '' });

/* =====================================================================
   HONORARIOS · qué se cobró y qué falta cobrar, cierre de caja
   Lo cobrado se cuenta por la fecha en que se cobró.
   ===================================================================== */
const honFiltro = { periodo:'mes', estado:'', medio:'', cob:'', q:'', max:50 };
const PERIODOS = [['hoy', 'Hoy'], ['semana', 'Esta semana'], ['mes', 'Este mes'], ['mesant', 'Mes pasado'], ['anio', 'Este año'], ['todo', 'Todo']];

function rangoPeriodo(k){
  const h = hoy();
  if (k === 'hoy') return [h, h];
  if (k === 'semana') return [inicioSemana(h), sumarDias(inicioSemana(h), 6)];
  if (k === 'mes') return [inicioMes(h), finMes(h)];
  if (k === 'mesant'){ const m = sumarMeses(inicioMes(h), -1); return [m, finMes(m)]; }
  if (k === 'anio') return [h.slice(0, 4) + '-01-01', h.slice(0, 4) + '-12-31'];
  return ['0000-01-01', '9999-12-31'];
}
const fechaHon = x => x.estado === 'cobrado' ? x.fechaCobro : x.fecha;
function filtrarHonorarios(sinEstado){
  const [a, b] = rangoPeriodo(honFiltro.periodo), q = normalizar(honFiltro.q.trim());
  return D().honorarios.filter(x => {
    const f = fechaHon(x); if (f < a || f > b) return false;
    if (!sinEstado && honFiltro.estado && x.estado !== honFiltro.estado) return false;
    if (honFiltro.medio && x.medio !== honFiltro.medio) return false;
    const p = paciente(x.pac);
    if (honFiltro.cob && (!p || p.cobertura !== honFiltro.cob)) return false;
    if (q && !normalizar(p ? p.nombre : '').includes(q)) return false;
    return true;
  }).sort((x, y) => fechaHon(y).localeCompare(fechaHon(x)));
}

      <div class="kpi revelar"><div class="kpi-l">${ico('corazon')} Bonificado</div><div class="kpi-v">${pesos(suma(bon))}</div><div class="kpi-d">${bon.length} consultas sin cargo</div></div>

        <td class="prim"><button style="text-align:left" onclick="abrirFicha('${x.pac}')">${personaHTML(p, p && p.cobertura ? COBERTURAS[p.cobertura] : '')}</button></td>

      ${lista.length > honFiltro.max ? `<div class="mas-filas"><button class="btn btn-linea btn-sm" onclick="honFiltro.max+=100;refrescar()">Ver más (${lista.length - honFiltro.max} restantes)</button></div>` : ''}`
      : vacio('dinero', 'No hay honorarios con estos filtros', 'Probá con otro período o estado.')}</div>`;

}
function guardarHonorario(id){

/* ---------- Cierre de caja del día ---------- */

    ${pen.length ? `<h4>Quedó pendiente de cobro</h4><table><tbody>${pen.map(h => `<tr><td>${esc(nombrePac(h.pac))}</td><td>${esc(h.concepto)}</td><td style="text-align:right">${pesos(h.monto)}</td></tr>`).join('')}</tbody></table>` : ''}
